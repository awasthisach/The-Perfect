# Dependabot — PR-only. Majors for sensitive stacks ignored.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "net.zetetic:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.dagger:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.squareup.okhttp3:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "gradle"
    groups:
      androidx:
        patterns: ["androidx.*"]
      google-play:
        patterns: ["com.google.android.*", "com.google.firebase*"]
      security-sensitive:
        patterns: ["net.zetetic:*", "com.google.dagger:*", "androidx.hilt*"]
      test:
        patterns: ["org.mockito*", "org.robolectric*", "junit*"]
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "actions/*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
