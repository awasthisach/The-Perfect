name: CPAS Production Gate

on:
  push:
    branches: [main, fix/drive-semantic-search-product-alignment]
  pull_request:
    branches: [main, fix/p0-vault-nio-publish-phase3]
  workflow_run:
    workflows: ["VVF Smart Manager CI & Quality Gate", "Weekly Instrumented Hard Gate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cpas-gate-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  # Main: serialize (preserve full-green evidence). PR: cancel stale runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpas-verify:
    name: CPAS Verify (fail-closed)
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    timeout-minutes: 55
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        # v6 runs on Node 24
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify Python
        run: python3 --version

      - name: Run verifier self-tests
        run: python3 -m unittest discover -s tools/audit -p 'test_*.py' -v

      - name: Run semantic CPAS verification
        id: cpas
        # Fail closed at the GitHub check level as well as in cpas-status.json.
        # BLOCKED must not appear as a green "Production Gate" check, or branch
        # protection could allow a merge while release blockers remain open.
        # The artifact is still uploaded by the always() step below for diagnosis.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          rm -f candidate-evidence.json cpas-status.json
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" || exit 1
          python3 tools/audit/wait_for_evidence.py --revision "$CANDIDATE_SHA"
          wait_code=$?
          python3 tools/audit/collect_evidence.py --revision "$CANDIDATE_SHA" --output candidate-evidence.json
          collect_code=$?
          python3 tools/audit/cpas_verify.py --root . --candidate-sha "$CANDIDATE_SHA" --ledger candidate-evidence.json
          code=$?
          set -e

          if [ ! -f cpas-status.json ]; then
            echo "::error::cpas-status.json was not produced (verifier crash)"
            exit 1
          fi

          status=$(python3 -c 'import json; print(json.load(open("cpas-status.json"))["production_status"]["value"])')
          blockers=$(python3 -c 'import json; print(",".join(json.load(open("cpas-status.json")).get("blocking_findings") or []) or "none")')
          echo "production_status=$status" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "blockers=$blockers" >> "$GITHUB_OUTPUT"

          if [ "$status" = "PASS" ] && [ "$code" -eq 0 ] && [ "$wait_code" -eq 0 ] && [ "$collect_code" -eq 0 ]; then
            echo "CPAS production_status=PASS"
            exit 0
          fi

          if [ "$status" = "BLOCKED" ]; then
            echo "::error::CPAS production_status=BLOCKED (fail-closed). blockers=${blockers}. See cpas-status artifact; this Production Gate cannot pass until blockers are closed."
            exit 1
          fi

          echo "::error::Unexpected CPAS status=${status} exit_code=${code}"
          exit 1

      - name: Upload computed CPAS status
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cpas-status-${{ env.CANDIDATE_SHA }}
          path: cpas-status.json
          if-no-files-found: error
          retention-days: 14
