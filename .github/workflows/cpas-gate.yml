name: CPAS Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpas-gate-${{ github.ref }}
  # Main: serialize (preserve full-green evidence). PR: cancel stale runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpas-verify:
    name: CPAS Verify (fail-closed)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        # v6 runs on Node 24
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify Python
        run: python3 --version

      - name: Run verifier self-tests
        run: python3 -m unittest discover -s tools/audit -p 'test_*.py' -v

      - name: Run semantic CPAS verification
        id: cpas
        # Fail-closed: a BLOCKED production status must fail this required check.
        # Keep the status artifact below via if: always() for diagnosis.
        run: |
          set +e
          python3 tools/audit/cpas_verify.py --root .
          code=$?
          set -e

          if [ ! -f cpas-status.json ]; then
            echo "::error::cpas-status.json was not produced (verifier crash)"
            exit 1
          fi

          status=$(python3 -c 'import json; print(json.load(open("cpas-status.json"))["production_status"]["value"])')
          blockers=$(python3 -c 'import json; print(",".join(json.load(open("cpas-status.json")).get("blocking_findings") or []) or "none")')
          echo "production_status=$status" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "blockers=$blockers" >> "$GITHUB_OUTPUT"

          failed_checks=$(python3 -c 'import json; d=json.load(open("cpas-status.json")); print(",".join(c["name"] for c in d.get("checks", []) if c.get("status") != "PASS") or "none")')
          echo "failed_checks=$failed_checks" >> "$GITHUB_OUTPUT"

          if [ "$status" = "PASS" ] && [ "$code" -eq 0 ]; then
            echo "CPAS production_status=PASS"
            exit 0
          fi

          if [ "$status" = "BLOCKED" ]; then
            echo "::error::CPAS production_status=BLOCKED. blockers=${blockers}; failed_checks=${failed_checks}. See cpas-status artifact."
            exit 1
          fi

          echo "::error::CPAS status/code mismatch or unexpected status=${status} exit_code=${code}"
          exit 1

      - name: Upload computed CPAS status
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cpas-status-${{ github.sha }}
          path: cpas-status.json
          if-no-files-found: error
          retention-days: 14
