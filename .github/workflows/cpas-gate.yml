name: CPAS Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpas-gate-${{ github.ref }}
  # Main: serialize (preserve full-green evidence). PR: cancel stale runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpas-verify:
    name: CPAS Verifier Execution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        # v6 runs on Node 24
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify Python
        run: python3 --version

      - name: Run verifier self-tests
        run: python3 -m unittest discover -s tools/audit -p 'test_*.py' -v

      - name: Run CPAS verifier (execution result only)
        id: cpas
        # Fail-closed: BLOCKED is an expected production state while critical
        # findings remain open. Emit a warning annotation, not an error, so the
        # job stays green without hiding the BLOCKED status.
        # Unexpected verifier crashes (no status file) still fail the job.
        run: |
          set +e
          python3 tools/audit/cpas_verify.py --root .
          code=$?
          set -e

          if [ ! -f cpas-status.json ]; then
            echo "::error::cpas-status.json was not produced (verifier crash)"
            exit 1
          fi

          status=$(python3 -c 'import json; print(json.load(open("cpas-status.json"))["production_status"]["value"])')
          blockers=$(python3 -c 'import json; print(",".join(json.load(open("cpas-status.json")).get("blocking_findings") or []) or "none")')
          echo "production_status=$status" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "blockers=$blockers" >> "$GITHUB_OUTPUT"

          if [ "$status" = "PASS" ]; then
            echo "CPAS verifier completed; production_status=PASS"
            exit 0
          fi

          if [ "$status" = "BLOCKED" ]; then
            echo "::warning::CPAS verifier completed; production_status=BLOCKED. blockers=${blockers}. A separate production-status check will fail."
            exit 0
          fi

          echo "::error::Unexpected CPAS status=${status} exit_code=${code}"
          exit 1

      - name: Require production_status=PASS
        if: steps.cpas.outputs.production_status != 'PASS'
        env:
          CPAS_STATUS: ${{ steps.cpas.outputs.production_status }}
          CPAS_BLOCKERS: ${{ steps.cpas.outputs.blockers }}
        run: |
          printf '::error::Release/production gate blocked: production_status=%s; blockers=%s\n' "$CPAS_STATUS" "$CPAS_BLOCKERS"
          exit 1

      - name: Upload computed CPAS status
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cpas-status-${{ github.sha }}
          path: cpas-status.json
          if-no-files-found: error
          retention-days: 14
