name: CPAS Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Nightly ORT Compliance Scan"]
    types: [completed]
    branches: [main, rebuild/stabilize-v1]

permissions:
  actions: read
  contents: read

concurrency:
  group: cpas-gate-${{ github.ref }}
  # Main: serialize (preserve full-green evidence). PR: cancel stale runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpas-verify:
    name: CPAS Verify (fail-closed)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        # v6 runs on Node 24
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Import exact-SHA ORT evidence when available
        if: github.event_name == 'workflow_run' || github.event_name == 'pull_request'
        timeout-minutes: 330
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          ORT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          RUN_ID="$ORT_RUN_ID"
          if [ -z "$RUN_ID" ]; then
            echo "Waiting for a completed ORT run for exact candidate SHA $TARGET_SHA"
            ELAPSED=0
            while [ "$ELAPSED" -lt 19800 ]; do
              RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly-ort.yml/runs?head_sha=$TARGET_SHA&per_page=20" --jq '.workflow_runs[] | select(.head_sha == env.TARGET_SHA and .status == "completed") | .id' | head -n 1 || true)"
              if [ -n "$RUN_ID" ]; then
                break
              fi
              sleep 60
              ELAPSED=$((ELAPSED + 60))
            done
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::warning::No completed ORT run for exact SHA $TARGET_SHA before timeout; CPAS remains fail-closed."
            exit 0
          fi

          DOWNLOAD_DIR="$RUNNER_TEMP/ort-download"
          mkdir -p "$DOWNLOAD_DIR"
          if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name ort-results-evidence --dir "$DOWNLOAD_DIR"; then
            echo "::warning::No ORT evidence artifact found for run $RUN_ID; CPAS remains fail-closed."
            exit 0
          fi

          RESULTS_DIR="$DOWNLOAD_DIR/ort-evidence/results"
          STATUS_FILE="$(find "$DOWNLOAD_DIR" -type f -name 'ort-status.json' -print -quit || true)"
          mkdir -p docs/assurance

          if [ -n "$STATUS_FILE" ]; then
            python3 - "$STATUS_FILE" "$TARGET_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          p, sha = Path(sys.argv[1]), sys.argv[2]
          data = json.loads(p.read_text(encoding="utf-8"))
          revision = data.get("scan_revision", data.get("revision"))
          if revision != sha:
              raise SystemExit(f"ORT status SHA mismatch: {revision!r} != {sha!r}")
          PY
            cp "$STATUS_FILE" docs/assurance/ort-status.json
          fi

          if [ -d "$RESULTS_DIR" ]; then
            set +e
            python3 tools/audit/verify_ort_outputs.py --results-dir "$RESULTS_DIR" --revision "$TARGET_SHA"
            VERIFY_CODE=$?
            set -e
            if [ "$VERIFY_CODE" -eq 0 ]; then
              cp "$RESULTS_DIR/bom.cyclonedx.json" docs/assurance/ort-bom.cyclonedx.json
              cp "$RESULTS_DIR/bom.spdx.json" docs/assurance/ort-bom.spdx.json
              echo "Imported validated ORT SBOMs for exact SHA $TARGET_SHA"
            else
              echo "::warning::ORT reports failed validation; SBOMs were not imported."
            fi
          else
            echo "::warning::ORT result reports are missing from the evidence artifact."
          fi

      - name: Verify Python
        run: python3 --version

      - name: Run verifier self-tests
        run: python3 -m unittest discover -s tools/audit -p 'test_*.py' -v

      - name: Run semantic CPAS verification
        id: cpas
        # Fail-closed: BLOCKED is an expected production state while critical
        # findings remain open. Emit a warning annotation, not an error, so the
        # job stays green without hiding the BLOCKED status.
        # Unexpected verifier crashes (no status file) still fail the job.
        run: |
          set +e
          python3 tools/audit/cpas_verify.py --root .
          code=$?
          set -e

          if [ ! -f cpas-status.json ]; then
            echo "::error::cpas-status.json was not produced (verifier crash)"
            exit 1
          fi

          status=$(python3 -c 'import json; print(json.load(open("cpas-status.json"))["production_status"]["value"])')
          blockers=$(python3 -c 'import json; print(",".join(json.load(open("cpas-status.json")).get("blocking_findings") or []) or "none")')
          echo "production_status=$status" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "blockers=$blockers" >> "$GITHUB_OUTPUT"

          if [ "$status" = "PASS" ]; then
            echo "CPAS production_status=PASS"
            exit 0
          fi

          if [ "$status" = "BLOCKED" ]; then
            echo "::warning::CPAS production_status=BLOCKED (fail-closed). blockers=${blockers}. See cpas-status artifact. Release promotion still requires PASS."
            exit 0
          fi

          echo "::error::Unexpected CPAS status=${status} exit_code=${code}"
          exit 1

      - name: Upload computed CPAS status
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cpas-status-${{ github.event.pull_request.head.sha || github.sha }}
          path: cpas-status.json
          if-no-files-found: error
          retention-days: 14
