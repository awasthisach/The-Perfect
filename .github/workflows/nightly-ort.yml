name: Nightly ORT Compliance Scan

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ort-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ort-scan:
    name: ORT Analyzer, Scanner, Evaluator, Advisor & SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      reports_verified: ${{ steps.verify_ort_reports.outcome == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run ORT compliance pipeline
        id: ort
        uses: oss-review-toolkit/ort-ci-github-action@70149d4579e446b0312f8b80fdd8d465a91e4391
        with:
          sw-name: The-Perfect
          sw-version: ${{ github.sha }}
          fail-on: "issues,violations"
          run: >-
            cache-dependencies,
            cache-scan-results,
            analyzer,
            scanner,
            evaluator,
            advisor,
            reporter,
            upload-results

      - name: Verify required ORT reports and SBOMs
        id: verify_ort_reports
        if: always()
        run: |
          set -euo pipefail
          RESULTS_DIR="$HOME/.ort/ort-results"
          python3 tools/audit/verify_ort_outputs.py --results-dir "$RESULTS_DIR" --revision "$GITHUB_SHA"

      - name: Record ORT status
        if: always()
        env:
          ORT_OUTCOME: ${{ steps.ort.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_ort_reports.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          outcome = os.environ.get("ORT_OUTCOME", "unknown")
          verified = os.environ.get("VERIFY_OUTCOME", "unknown")
          status = "PASS" if outcome == "success" and verified == "success" else "BLOCKED"
          result = {
              "gate_id": "GATE-LICENSE-001",
              "scanner": "OSS Review Toolkit (ORT)",
              "status": status,
              "scan_revision": os.environ["GITHUB_SHA"],
              "ort_action_outcome": outcome,
              "report_validation_outcome": verified,
              "reason": "ORT stages and all required reports passed" if status == "PASS" else "ORT failed, findings exceeded policy thresholds, or required reports were invalid/missing"
          }
          Path("ort-status.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result))
          if status != "PASS":
              raise SystemExit(1)
          PY

      - name: Package ORT evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p ort-evidence/results
          if [ -d "$HOME/.ort/ort-results" ]; then
            cp -a "$HOME/.ort/ort-results/." ort-evidence/results/
          fi
          if [ -s ort-status.json ]; then
            cp ort-status.json ort-evidence/ort-status.json
          else
            printf '%s\n' '{"gate_id":"GATE-LICENSE-001","scanner":"OSS Review Toolkit (ORT)","status":"BLOCKED","scan_revision":"${{ github.sha }}","reason":"ORT status was not generated"}' > ort-evidence/ort-status.json
          fi

      - name: Extract verified SBOMs for assurance docs
        if: always() && steps.verify_ort_reports.outcome == 'success'
        run: |
          set -euo pipefail
          RESULTS_DIR="$HOME/.ort/ort-results"
          ASSURANCE_DIR="docs/assurance"

          # Copy CycloneDX and SPDX SBOMs to assurance directory
          if [ -f "$RESULTS_DIR/bom.cyclonedx.json" ]; then
            cp "$RESULTS_DIR/bom.cyclonedx.json" "$ASSURANCE_DIR/ort-bom.cyclonedx.json"
            echo "Copied CycloneDX SBOM"
          fi

          if [ -f "$RESULTS_DIR/bom.spdx.json" ]; then
            cp "$RESULTS_DIR/bom.spdx.json" "$ASSURANCE_DIR/ort-bom.spdx.json"
            echo "Copied SPDX SBOM"
          fi

          # Copy ORT status
          if [ -f "ort-status.json" ]; then
            cp "ort-status.json" "$ASSURANCE_DIR/ort-status.json"
            echo "Copied ORT status"
          fi

          # List what was copied
          ls -lh "$ASSURANCE_DIR"/ort-* || echo "No ORT files found"

      - name: Upload ORT evidence artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ort-results-evidence
          path: |
            ort-evidence/
            docs/assurance/ort-*.json
          if-no-files-found: error
          retention-days: 90

  publish-ort-evidence:
    name: Publish verified ORT evidence PR
    needs: ort-scan
    if: ${{ always() && needs.ort-scan.outputs.reports_verified == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download verified ORT evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${GITHUB_RUN_ID}" --name ort-results-evidence --dir "${RUNNER_TEMP}/ort-evidence"

      - name: Prepare assurance files
        run: |
          set -euo pipefail
          RESULTS_DIR="${RUNNER_TEMP}/ort-evidence/results"
          ASSURANCE_DIR="docs/assurance"
          test -s "${RESULTS_DIR}/bom.cyclonedx.json"
          test -s "${RESULTS_DIR}/bom.spdx.json"
          test -s "${RUNNER_TEMP}/ort-evidence/ort-status.json"
          cp "${RESULTS_DIR}/bom.cyclonedx.json" "${ASSURANCE_DIR}/ort-bom.cyclonedx.json"
          cp "${RESULTS_DIR}/bom.spdx.json" "${ASSURANCE_DIR}/ort-bom.spdx.json"
          cp "${RUNNER_TEMP}/ort-evidence/ort-status.json" "${ASSURANCE_DIR}/ort-status.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("docs/assurance/ort-status.json").read_text(encoding="utf-8"))
          if status.get("status") not in {"PASS", "BLOCKED"}:
              raise SystemExit("ORT status must explicitly be PASS or BLOCKED")
          print("ORT evidence status:", status["status"])
          PY

      - name: Create PR with verified ORT SBOMs (PASS or BLOCKED status)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/assurance/ort-bom.cyclonedx.json docs/assurance/ort-bom.spdx.json docs/assurance/ort-status.json; then
            echo "No changes to ORT files, skipping PR"
            exit 0
          fi
          BRANCH="auto/ort-sboms-${GITHUB_RUN_ID}"
          git switch -c "${BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/assurance/ort-bom.cyclonedx.json docs/assurance/ort-bom.spdx.json docs/assurance/ort-status.json
          git commit -m "chore(compliance): publish verified ORT SBOM evidence"
          git push origin "${BRANCH}"
          gh pr create \\
            --title "Auto-update ORT SBOMs (nightly compliance scan)" \\
            --body "Publishes ORT SBOM evidence for review from workflow run #${GITHUB_RUN_ID}. The status file is explicit: BLOCKED is not a compliance pass and production readiness remains blocked until findings are reviewed and remediated." \\
            --base main \\
            --head "${BRANCH}" \\
            --label "compliance,automated,dependencies"
