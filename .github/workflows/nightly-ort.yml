name: Nightly ORT Compliance Scan

on:
  # This candidate-branch workflow permits only manual dispatch. GitHub scheduled
  # events use the default branch; changing that schedule requires an owner change on main.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ort-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ort-scan:
    # This guard applies only when this branch's workflow file is selected.
    # The default-branch schedule remains controlled by main until an owner changes it.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/audit/fixes-2026-11' }}
    name: ORT Analyzer, Scanner, Evaluator, Advisor & SBOM
    runs-on: ubuntu-24.04
    # A cold Android/Gradle dependency scan can exceed five hours. GitHub-hosted
    # runners cap a job at six hours; incomplete reports remain BLOCKED.
    timeout-minutes: 360
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - name: Verify checked-out candidate SHA
        id: verify_checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked-out SHA $actual_sha does not match selected workflow ref SHA $EXPECTED_SHA"
            exit 1
          fi
          echo "checkout_sha=$actual_sha" >> "$GITHUB_OUTPUT"

      - name: Prepare pinned ORT config with project package curations
        run: |
          set -euo pipefail
          config_dir="$HOME/.ort/config"
          mkdir -p "$HOME/.ort"
          git init "$config_dir"
          git -C "$config_dir" remote add origin https://github.com/oss-review-toolkit/ort-config.git
          git -C "$config_dir" fetch --depth 1 origin 6cb99721f7e536361ca2b20d8bcdec9c3125236b
          git -C "$config_dir" checkout --detach FETCH_HEAD
          install -m 0644 ort-curations.yml "$config_dir/curations.yml"

      - name: Run ORT compliance pipeline
        id: ort
        uses: ./.github/actions/ort
        with:
          sw-name: The-Perfect
          sw-version: ${{ github.sha }}
          fail-on: "issues,violations"
          ort-cli-evaluate-args: >-
            --package-curations-file /home/ort/work/The-Perfect/The-Perfect/ort-curations.yml
          run: >-
            cache-dependencies,
            cache-scan-results,
            analyzer,
            scanner,
            evaluator,
            advisor,
            reporter,
            upload-results

      - name: Verify required ORT reports and SBOMs
        id: verify_ort_reports
        if: always()
        env:
          ORT_SCAN_SHA: ${{ github.sha }}
          CHECKOUT_SHA: ${{ steps.verify_checkout.outputs.checkout_sha }}
        run: |
          set -euo pipefail
          if [ "$CHECKOUT_SHA" != "$ORT_SCAN_SHA" ]; then
            echo "::error::ORT checkout SHA does not match requested scan SHA"
            exit 1
          fi
          RESULTS_DIR="$HOME/.ort/ort-results"
          python3 tools/audit/verify_ort_outputs.py --results-dir "$RESULTS_DIR" --revision "$ORT_SCAN_SHA" --curations-file ort-curations.yml

      - name: Record ORT status
        if: always()
        env:
          ORT_OUTCOME: ${{ steps.ort.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_ort_reports.outcome }}
          ORT_SCAN_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          CHECKOUT_SHA: ${{ steps.verify_checkout.outputs.checkout_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          outcome = os.environ.get("ORT_OUTCOME", "unknown")
          verified = os.environ.get("VERIFY_OUTCOME", "unknown")
          expected_sha = os.environ["WORKFLOW_SHA"]
          checkout_sha = os.environ.get("CHECKOUT_SHA", "")
          scan_sha = os.environ["ORT_SCAN_SHA"]
          provenance_matches = checkout_sha == expected_sha == scan_sha
          status = "PASS" if outcome == "success" and verified == "success" and provenance_matches else "BLOCKED"
          result = {
              "gate_id": "GATE-LICENSE-001",
              "scanner": "OSS Review Toolkit (ORT)",
              "status": status,
              "workflow_run_id": int(os.environ["WORKFLOW_RUN_ID"]),
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "workflow_sha": expected_sha,
              "checkout_revision": checkout_sha,
              "scan_revision": scan_sha,
              "ort_action_outcome": outcome,
              "report_validation_outcome": verified,
              "reason": "ORT stages, checkout provenance and all required reports passed" if status == "PASS" else "ORT failed, SHA provenance mismatched, findings exceeded policy thresholds, or required reports were invalid/missing"
          }
          Path("ort-status.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result))
          if status != "PASS":
              raise SystemExit(1)
          PY

      - name: Package ORT evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p ort-evidence/results
          if [ -d "$HOME/.ort/ort-results" ]; then
            cp -a "$HOME/.ort/ort-results/." ort-evidence/results/
          fi
          if [ -s ort-status.json ]; then
            cp ort-status.json ort-evidence/ort-status.json
          else
            printf '%s\\n' '{"gate_id":"GATE-LICENSE-001","scanner":"OSS Review Toolkit (ORT)","status":"BLOCKED","workflow_run_id":${{ github.run_id }},"workflow_ref":"${{ github.ref }}","workflow_sha":"${{ github.sha }}","checkout_revision":"","scan_revision":"${{ github.sha }}","reason":"ORT status was not generated"}' > ort-evidence/ort-status.json
          fi

      - name: Upload ORT evidence artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ort-results-evidence
          path: ort-evidence/
          if-no-files-found: error
          retention-days: 90
