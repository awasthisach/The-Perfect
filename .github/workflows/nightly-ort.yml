name: Nightly ORT Compliance Scan

# ORT is expensive (up to 6h). Do not attach to every PR synchronize — that
# cancels or queues scans and burns Actions minutes without producing SBOMs.
# Run on schedule or explicit workflow_dispatch against a freeze candidate SHA.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One ORT per ref; cancel stale runs when a new dispatch targets the same branch.
  group: nightly-ort-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ort-scan:
    name: ORT Analyzer, Scanner, Evaluator, Advisor & SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Resolve scan revision
        id: rev
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.rev.outputs.sha }}
          fetch-depth: 0

      - name: Run ORT compliance pipeline
        id: ort
        uses: oss-review-toolkit/ort-ci-github-action@70149d4579e446b0312f8b80fdd8d465a91e4391
        with:
          sw-name: The-Perfect
          sw-version: ${{ steps.rev.outputs.sha }}
          fail-on: "issues,violations"
          run: >-
            cache-dependencies,
            cache-scan-results,
            analyzer,
            scanner,
            evaluator,
            advisor,
            reporter,
            upload-results

      - name: Verify required ORT reports and SBOMs
        id: verify_ort_reports
        if: always()
        env:
          SCAN_SHA: ${{ steps.rev.outputs.sha }}
        run: |
          set -euo pipefail
          RESULTS_DIR="$HOME/.ort/ort-results"
          python3 tools/audit/verify_ort_outputs.py --results-dir "$RESULTS_DIR" --revision "$SCAN_SHA"

      - name: Record ORT status
        if: always()
        env:
          ORT_OUTCOME: ${{ steps.ort.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_ort_reports.outcome }}
          SCAN_SHA: ${{ steps.rev.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          outcome = os.environ.get("ORT_OUTCOME", "unknown")
          verified = os.environ.get("VERIFY_OUTCOME", "unknown")
          status = "PASS" if outcome == "success" and verified == "success" else "BLOCKED"
          result = {
              "gate_id": "GATE-LICENSE-001",
              "scanner": "OSS Review Toolkit (ORT)",
              "status": status,
              "scan_revision": os.environ["SCAN_SHA"],
              "ort_action_outcome": outcome,
              "report_validation_outcome": verified,
              "reason": (
                  "ORT stages and all required reports passed"
                  if status == "PASS"
                  else "ORT failed, findings exceeded policy thresholds, or required reports were invalid/missing"
              ),
          }
          Path("ort-status.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result))
          if status != "PASS":
              raise SystemExit(1)
          PY

      - name: Package ORT evidence
        if: always()
        env:
          SCAN_SHA: ${{ steps.rev.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p ort-evidence/results
          if [ -d "$HOME/.ort/ort-results" ]; then
            cp -a "$HOME/.ort/ort-results/." ort-evidence/results/
          fi
          if [ -s ort-status.json ]; then
            cp ort-status.json ort-evidence/ort-status.json
          else
            python3 - <<'PY'
            import json, os
            from pathlib import Path
            Path("ort-evidence/ort-status.json").write_text(json.dumps({
              "gate_id": "GATE-LICENSE-001",
              "scanner": "OSS Review Toolkit (ORT)",
              "status": "BLOCKED",
              "scan_revision": os.environ["SCAN_SHA"],
              "reason": "ORT status was not generated",
            }, indent=2) + "\n", encoding="utf-8")
            PY
          fi

      - name: Extract available ORT outputs for assurance evidence
        if: always()
        run: |
          set -euo pipefail
          RESULTS_DIR="$HOME/.ort/ort-results"
          ASSURANCE_DIR="docs/assurance"
          mkdir -p "$ASSURANCE_DIR"

          if [ -f "$RESULTS_DIR/bom.cyclonedx.json" ]; then
            cp "$RESULTS_DIR/bom.cyclonedx.json" "$ASSURANCE_DIR/ort-bom.cyclonedx.json"
            echo "Copied CycloneDX SBOM"
          fi

          if [ -f "$RESULTS_DIR/bom.spdx.json" ]; then
            cp "$RESULTS_DIR/bom.spdx.json" "$ASSURANCE_DIR/ort-bom.spdx.json"
            echo "Copied SPDX SBOM"
          fi

          if [ -f "ort-status.json" ]; then
            cp "ort-status.json" "$ASSURANCE_DIR/ort-status.json"
            echo "Copied ORT status"
          fi

          ls -lh "$ASSURANCE_DIR"/ort-* || echo "No ORT files found"

      - name: Upload ORT evidence artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ort-results-evidence
          path: |
            ort-evidence/
            docs/assurance/ort-*.json
          if-no-files-found: error
          retention-days: 90
