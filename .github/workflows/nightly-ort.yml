name: Nightly ORT Compliance Scan

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ort-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ort_scan:
    name: Open Source Compliance (ORT)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      ort_status: ${{ steps.record_ort_status.outputs.status }}
      scan_revision: ${{ steps.record_ort_status.outputs.scan_revision }}
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # ORT's embedded Git/JGit downloader cannot use the ephemeral runner SSH agent.
      - name: Use HTTPS instead of SSH for GitHub source downloads
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
      - name: Restore reusable ORT scanner cache
        id: ort_cache_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.ort/scanner/
          key: ${{ runner.os }}-ort-scan-results-v2-${{ hashFiles('.ort.yml', 'gradle/libs.versions.toml', '**/build.gradle', '**/build.gradle.kts', '**/settings.gradle', '**/settings.gradle.kts', '**/gradle.lockfile', '**/libs.versions.toml', '**/package-lock.json', '**/pnpm-lock.yaml', '**/pom.xml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-ort-scan-results-v2-${{ hashFiles('.ort.yml', 'gradle/libs.versions.toml', '**/build.gradle', '**/build.gradle.kts', '**/settings.gradle', '**/settings.gradle.kts', '**/gradle.lockfile', '**/libs.versions.toml', '**/package-lock.json', '**/pnpm-lock.yaml', '**/pom.xml') }}-
            # Legacy cache fallback: prior runs saved scanner state under v1.
            ${{ runner.os }}-ort-scan-results-v1-

      - name: Record ORT scanner cache restore
        if: always()
        env:
          CACHE_HIT: ${{ steps.ort_cache_restore.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.ort_cache_restore.outputs.cache-matched-key }}
        run: |
          {
            echo "### ORT scanner cache"
            echo "- Exact hit: \`${CACHE_HIT:-false}\`"
            echo "- Restored key: \`${CACHE_MATCHED_KEY:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: OSS Review Toolkit compliance gate (hard fail for release)
        timeout-minutes: 330
        id: ort
        uses: ./.github/actions/ort-ci
        with:
          sw-name: The-Perfect
          sw-version: ${{ github.sha }}
          ort-config-revision: 5075f4308109384c98a6a2fab53246f7b60d59f4
          # Enable project-scoped .ort.yml package curations; default ORT config disables them.
          ort-cli-args: -P ort.enableRepositoryPackageCurations=true
          run: >-
            cache-dependencies,
            labels,
            analyzer,
            scanner,
            evaluator,
            advisor,
            reporter,
            upload-results,
            upload-evaluation-result,
            upload-advisor-result,
            upload-scan-result
          fail-on: 'violations,issues'

      - name: Verify ORT results and SBOM outputs
        if: ${{ always() && steps.ort.outputs.results-path != '' }}
        env:
          ORT_RESULTS_DIR: ${{ steps.ort.outputs.results-path }}
          SCAN_REVISION: ${{ github.sha }}
        run: python3 tools/audit/verify_ort_outputs.py --results-dir "$ORT_RESULTS_DIR" --revision "$SCAN_REVISION"

      - name: Persist partial ORT scanner cache even after scan timeout
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.ort/scanner/
          key: ${{ runner.os }}-ort-scan-results-v2-${{ hashFiles('.ort.yml', 'gradle/libs.versions.toml', '**/build.gradle', '**/build.gradle.kts', '**/settings.gradle', '**/settings.gradle.kts', '**/gradle.lockfile', '**/libs.versions.toml', '**/package-lock.json', '**/pnpm-lock.yaml', '**/pom.xml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Record ORT release gate status
        id: record_ort_status
        if: always()
        env:
          ORT_STEP_OUTCOME: ${{ steps.ort.outcome }}
          ORT_EVALUATOR_EXIT_CODE: ${{ steps.ort.outputs.evaluator-exit-code }}
          ORT_ADVISOR_EXIT_CODE: ${{ steps.ort.outputs.advisor-exit-code }}
          SCAN_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          outcome = os.environ.get("ORT_STEP_OUTCOME", "unknown")
          evaluator = os.environ.get("ORT_EVALUATOR_EXIT_CODE", "")
          advisor = os.environ.get("ORT_ADVISOR_EXIT_CODE", "")
          status = "PASS" if outcome == "success" and evaluator == "0" and advisor == "0" else "BLOCKED"
          result = {
              "gate_id": "GATE-LICENSE-001",
              "scanner": "OSS Review Toolkit (ORT)",
              "status": status,
              "scan_revision": os.environ["SCAN_REVISION"],
              "ort_action_outcome": outcome,
              "evaluator_exit_code": evaluator or None,
              "advisor_exit_code": advisor or None,
              "reason": "ORT evaluator and advisor completed successfully" if status == "PASS" else "ORT failed or reported policy/security findings; review ORT result artifacts"
          }
          Path("ort-status.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("status=" + status + "\n")
              output.write("scan_revision=" + os.environ["SCAN_REVISION"] + "\n")
          if status != "PASS":
              raise SystemExit(1)
          PY

      - name: Package ORT evidence for release gating
        if: always()
        env:
          ORT_RESULTS_DIR: ${{ steps.ort.outputs.results-path }}
        run: |
          set -euo pipefail
          mkdir -p ort-evidence/results
          if [ -n "${ORT_RESULTS_DIR:-}" ] && [ -d "$ORT_RESULTS_DIR" ]; then
            cp -a "$ORT_RESULTS_DIR/." ort-evidence/results/
          fi
          if [ -s ort-status.json ]; then
            cp ort-status.json ort-evidence/ort-status.json
          else
            printf '%s\n' '{"gate_id":"GATE-LICENSE-001","scanner":"OSS Review Toolkit (ORT)","status":"BLOCKED","scan_revision":"${{ github.sha }}","reason":"ORT status report was not generated"}' > ort-evidence/ort-status.json
          fi

      - name: Upload ORT evidence artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ort-results-evidence
          path: ort-evidence/
          if-no-files-found: error
          retention-days: 90

