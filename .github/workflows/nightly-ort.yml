name: Nightly ORT Compliance Scan

on:
  # Run nightly on the default branch and on candidate PR revisions so CPAS can
  # consume evidence for the exact PR head SHA. Manual dispatch supports frozen candidates.
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ort-${{ github.ref }}
  # PR scans are candidate-SHA evidence: cancel an obsolete scan when a newer
  # commit arrives on the same PR. Scheduled/manual runs are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ort-scan:
    # Scheduled runs use the default branch; manual dispatch can target a selected branch.
    name: ORT Analyzer, Scanner, Evaluator, Advisor & SBOM
    runs-on: ubuntu-24.04
    # A cold Android/Gradle dependency scan can exceed five hours. GitHub-hosted
    # runners cap a job at six hours; incomplete reports remain BLOCKED.
    timeout-minutes: 360
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17 and restore the shared Gradle dependency cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Android SDK for Gradle inspection
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          accept-android-sdk-licenses: true

      - name: Prewarm Gradle plugin and Android project model cache
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew --no-daemon help

      - name: Verify checked-out candidate SHA
        id: verify_checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked-out SHA $actual_sha does not match selected workflow ref SHA $EXPECTED_SHA"
            exit 1
          fi
          echo "checkout_sha=$actual_sha" >> "$GITHUB_OUTPUT"

      - name: Prepare pinned ORT config with project package curations
        run: |
          set -euo pipefail
          config_dir="$HOME/.ort/config"
          mkdir -p "$HOME/.ort"
          git init "$config_dir"
          git -C "$config_dir" remote add origin https://github.com/oss-review-toolkit/ort-config.git
          git -C "$config_dir" fetch --depth 1 origin 6cb99721f7e536361ca2b20d8bcdec9c3125236b
          git -C "$config_dir" checkout --detach FETCH_HEAD
          install -m 0644 ort-curations.yml "$config_dir/curations.yml"

          # Reuse compatible public scan results before running expensive source scans.
          # ClearlyDefined is read-only; new results are persisted in the local cache,
          # which the ORT action already stores under $HOME/.ort/scanner/.
          cat > "$config_dir/config.yml" <<'ORT_CONFIG'
          ort:
            scanner:
              storages:
                local:
                  backend:
                    localFileStorage:
                      directory: ~/.ort/scanner/results
                      compression: false
                clearlyDefined:
                  serverUrl: https://api.clearlydefined.io
              storageReaders: [local, clearlyDefined]
              storageWriters: [local]
          ORT_CONFIG

      - name: Run ORT compliance pipeline
        id: ort
        uses: ./.github/actions/ort
        with:
          sw-name: The-Perfect
          sw-version: ${{ github.event.pull_request.head.sha || github.sha }}
          fail-on: "issues,violations"
          # Retain excluded test dependencies in analyzer/SBOM metadata, but do not
          # run expensive source scans on dependencies that are not shipped.
          ort-cli-args: -P ort.scanner.skipExcluded=true
          ort-cli-evaluate-args: >-
            --package-curations-file /home/ort/work/The-Perfect/The-Perfect/ort-curations.yml
          run: >-
            cache-dependencies,
            cache-scan-results,
            analyzer,
            scanner,
            evaluator,
            advisor,
            reporter,
            upload-results

      - name: Save ORT scan-result cache (including partial scan results)
        id: save_ort_cache
        if: ${{ always() && steps.verify_checkout.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ort/scanner/
          key: ${{ runner.os }}-ort-scan-results-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.lockfile', 'gradle/libs.versions.toml', '.ort.yml', 'ort-curations.yml', '.github/workflows/nightly-ort.yml', '.github/actions/ort/action.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify ORT cache save and record cache manifest
        id: verify_ort_cache
        if: ${{ always() && steps.verify_checkout.outcome == 'success' }}
        env:
          CACHE_SAVE_OUTCOME: ${{ steps.save_ort_cache.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          cache_dir = Path.home() / ".ort" / "scanner"
          files = sorted(path for path in cache_dir.rglob("*") if path.is_file()) if cache_dir.is_dir() else []
          total_bytes = sum(path.stat().st_size for path in files)
          status = "PASS" if os.environ.get("CACHE_SAVE_OUTCOME") == "success" and files else "BLOCKED"
          manifest = {
              "gate_id": "GATE-ORT-CACHE-001",
              "status": status,
              "cache_save_step_outcome": os.environ.get("CACHE_SAVE_OUTCOME", "unknown"),
              "cache_directory": str(cache_dir),
              "file_count": len(files),
              "total_bytes": total_bytes,
              "file_inventory": [
                  {"path": str(path.relative_to(cache_dir)), "size_bytes": path.stat().st_size}
                  for path in files
              ],
          }
          Path("ort-cache-manifest.json").write_text(json.dumps(manifest, indent=2) + chr(10), encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"cache_status={status}" + chr(10))
              output.write(f"cache_file_count={len(files)}" + chr(10))
          print(json.dumps(manifest))
          if status != "PASS":
              raise SystemExit("ORT scan-result cache save or non-empty cache validation failed")
          PY

      - name: Verify required ORT reports and SBOMs
        id: verify_ort_reports
        if: always()
        env:
          ORT_SCAN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_SHA: ${{ steps.verify_checkout.outputs.checkout_sha }}
        run: |
          set -euo pipefail
          if [ "$CHECKOUT_SHA" != "$ORT_SCAN_SHA" ]; then
            echo "::error::ORT checkout SHA does not match requested scan SHA"
            exit 1
          fi
          RESULTS_DIR="$HOME/.ort/ort-results"
          python3 tools/audit/verify_ort_outputs.py --results-dir "$RESULTS_DIR" --revision "$ORT_SCAN_SHA" --curations-file ort-curations.yml

      - name: Record ORT status
        if: always()
        env:
          ORT_OUTCOME: ${{ steps.ort.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_ort_reports.outcome }}
          CACHE_OUTCOME: ${{ steps.verify_ort_cache.outcome }}
          CACHE_STATUS: ${{ steps.verify_ort_cache.outputs.cache_status }}
          CACHE_FILE_COUNT: ${{ steps.verify_ort_cache.outputs.cache_file_count }}
          ORT_SCAN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_SHA: ${{ steps.verify_checkout.outputs.checkout_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          outcome = os.environ.get("ORT_OUTCOME", "unknown")
          verified = os.environ.get("VERIFY_OUTCOME", "unknown")
          expected_sha = os.environ["WORKFLOW_SHA"]
          checkout_sha = os.environ.get("CHECKOUT_SHA", "")
          scan_sha = os.environ["ORT_SCAN_SHA"]
          provenance_matches = checkout_sha == expected_sha == scan_sha
          cache_status = os.environ.get("CACHE_STATUS", "unknown")
          cache_file_count = int(os.environ.get("CACHE_FILE_COUNT", "0") or "0")
          cache_verified = os.environ.get("CACHE_OUTCOME") == "success" and cache_status == "PASS" and cache_file_count > 0
          status = "PASS" if outcome == "success" and verified == "success" and provenance_matches and cache_verified else "BLOCKED"
          result = {
              "gate_id": "GATE-LICENSE-001",
              "scanner": "OSS Review Toolkit (ORT)",
              "status": status,
              "workflow_run_id": int(os.environ["WORKFLOW_RUN_ID"]),
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "workflow_sha": expected_sha,
              "checkout_revision": checkout_sha,
              "scan_revision": scan_sha,
              "ort_action_outcome": outcome,
              "report_validation_outcome": verified,
              "cache_save_step_outcome": os.environ.get("CACHE_OUTCOME", "unknown"),
              "cache_validation_status": cache_status,
              "cache_file_count": cache_file_count,
              "reason": "ORT stages, checkout provenance, required reports and non-empty scan-result cache save passed" if status == "PASS" else "ORT failed, SHA provenance mismatched, cache save/validation failed, findings exceeded policy thresholds, or required reports were invalid/missing"
          }
          Path("ort-status.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result))
          if status != "PASS":
              raise SystemExit(1)
          PY

      - name: Package ORT evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p ort-evidence/results
          if [ -d "$HOME/.ort/ort-results" ]; then
            cp -a "$HOME/.ort/ort-results/." ort-evidence/results/
          fi
          if [ -s ort-cache-manifest.json ]; then
            cp ort-cache-manifest.json ort-evidence/ort-cache-manifest.json
          fi
          if [ -s ort-status.json ]; then
            cp ort-status.json ort-evidence/ort-status.json
          else
            printf '%s\\n' '{"gate_id":"GATE-LICENSE-001","scanner":"OSS Review Toolkit (ORT)","status":"BLOCKED","workflow_run_id":${{ github.run_id }},"workflow_ref":"${{ github.ref }}","workflow_sha":"${{ github.event.pull_request.head.sha || github.sha }}","checkout_revision":"","scan_revision":"${{ github.event.pull_request.head.sha || github.sha }}","reason":"ORT status was not generated"}' > ort-evidence/ort-status.json
          fi

      - name: Upload ORT evidence artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ort-results-evidence
          path: ort-evidence/
          if-no-files-found: error
          retention-days: 90
