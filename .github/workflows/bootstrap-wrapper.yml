name: Verify Gradle Wrapper

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "gradle/wrapper/gradle-wrapper.jar"
      - "gradle/wrapper/gradle-wrapper.properties"
      - "gradlew"
      - ".github/workflows/bootstrap-wrapper.yml"

permissions:
  contents: read

jobs:
  verify-wrapper:
    name: Verify committed Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Verify wrapper files
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version
