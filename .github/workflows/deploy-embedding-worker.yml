name: Deploy authenticated Drive embedding worker

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Deploy the reviewed Worker source to production"
        type: choice
        required: true
        default: "no"
        options:
          - "no"
          - "yes"
      confirm_gemini_data_handling:
        description: "Confirm paid Gemini billing and provider data-handling review (required only to enable embeddings)"
        type: choice
        required: true
        default: "no"
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: drive-semantic-embed-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm_deploy == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout The-Perfect only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Require reviewed release-candidate branch
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_REF" != "refs/heads/candidate/drive-semantic-search-release" ]; then
            echo "::error::Production Worker deployment is restricted to candidate/drive-semantic-search-release; selected ref was $DEPLOY_REF."
            exit 1
          fi

      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.149.0

      - name: Guard production embedding enablement
        env:
          CONFIRM_GEMINI_DATA_HANDLING: ${{ inputs.confirm_gemini_data_handling }}
        run: |
          set -euo pipefail
          if grep -Fq 'GEMINI_PRODUCTION_APPROVED = "true"' cloudflare/drive-semantic-embed/wrangler.toml; then
            if [ "$CONFIRM_GEMINI_DATA_HANDLING" != "yes" ]; then
              echo "::error::Embedding is enabled in wrangler.toml but the dispatch did not confirm paid Gemini billing and provider data handling."
              exit 1
            fi
          else
            echo "Worker will deploy with embeddings disabled by default; no Gemini production approval is inferred."
          fi

      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "::error::Missing repository secret GEMINI_API_KEY"; exit 1; }
          test -n "$FIREBASE_APP_ID" || { echo "::error::Missing repository secret FIREBASE_APP_ID"; exit 1; }

      - name: Store server-only Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$GEMINI_API_KEY" | wrangler secret put GEMINI_API_KEY --config cloudflare/drive-semantic-embed/wrangler.toml
          printf '%s' "$FIREBASE_APP_ID" | wrangler secret put FIREBASE_APP_ID --config cloudflare/drive-semantic-embed/wrangler.toml

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config cloudflare/drive-semantic-embed/wrangler.toml

      - name: Verify deployed health contract
        env:
          GEMINI_APPROVED: ${{ contains(github.event.inputs.confirm_gemini_data_handling, 'yes') }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const response = await fetch("https://drive-semantic-embed.awasthi-sach.workers.dev/");
          const body = await response.json();
          const expectedStatus = process.env.GEMINI_APPROVED === "true" ? 200 : 503;
          const expectedOk = process.env.GEMINI_APPROVED === "true";
          if (response.status !== expectedStatus || body.ok !== expectedOk ||
              body.model !== "gemini-embedding-2" || body.version !== "4" || body.dimension !== 768) {
            throw new Error(`Worker health mismatch: HTTP ${response.status}, body=${JSON.stringify(body)}`);
          }
          process.stdout.write("Embedding Worker health contract verified for configured approval state.\n");
          NODE

      - name: Verify native endpoint fails closed without Firebase credentials
        env:
          GEMINI_APPROVED: ${{ contains(github.event.inputs.confirm_gemini_data_handling, 'yes') }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/worker-auth-smoke.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"texts":["release-gate-auth-smoke"],"mode":"query","version":"4"}' \
            https://drive-semantic-embed.awasthi-sach.workers.dev/embed)"
          if [ "$GEMINI_APPROVED" = "true" ]; then
            expected_status=401
            expected_error="unauthorized"
          else
            expected_status=503
            expected_error="production_approval_required"
          fi
          if [ "$status" != "$expected_status" ]; then
            echo "::error::Native /embed expected HTTP $expected_status but got $status."
            cat /tmp/worker-auth-smoke.json
            exit 1
          fi
          node -e 'const x=require("/tmp/worker-auth-smoke.json"); if(x.error!==process.argv[1]) process.exit(1)' "$expected_error"
          echo "Native endpoint failed closed as expected for the configured approval state."
