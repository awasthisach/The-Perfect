name: assemble-explorer-fix
on:
  push:
    paths:
      - "tools/assemble-explorer/**"
    branches:
      - "fix/file-open-ocr-sdcard"
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file-open-ocr-sdcard
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble explorer sources
        run: python3 tools/assemble-explorer/assemble.py
      - name: Commit restored sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feature/explorer/src/main/java/com/vvf/smartmanager/feature/explorer/ExplorerViewModel.kt \
                  feature/explorer/src/main/java/com/vvf/smartmanager/feature/explorer/components/ExplorerDialogs.kt \
                  feature/explorer/src/main/java/com/vvf/smartmanager/feature/explorer/ExplorerScreen.kt
          git diff --staged --quiet || git commit -m "fix(explorer): restore Screen/VM/Dialogs (Open+OCR EN+HI)"
          git push origin HEAD:fix/file-open-ocr-sdcard
