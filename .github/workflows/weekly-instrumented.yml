name: Weekly Instrumented Hard Gate

# Hard (non-advisory) SQLCipher instrumented run — compensates for PR/main
# emulator continue-on-error skips on the primary CI job.
on:
  push:
    branches: [fix/portable-backup-security]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-instrumented
  cancel-in-progress: false

jobs:
  instrumented-hard:
    name: SQLCipher Instrumented (hard)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ""
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install SDK components
        run: |
          # Accept all licenses first to prevent interactive prompts
          yes | sdkmanager --licenses || true
          # Install required components without the 'yes' pipe
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          test -d "$ANDROID_HOME/system-images/android-35/google_apis/x86_64"


      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate SQLCipher 4.5.4 compatibility fixture
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sqlcipher.tgz https://github.com/sqlcipher/sqlcipher/archive/refs/tags/v4.5.4.tar.gz
          tar -xzf /tmp/sqlcipher.tgz -C /tmp
          cd /tmp/sqlcipher-4.5.4
          ./configure --enable-tempstore=yes CFLAGS="-DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL" LDFLAGS="-lcrypto" --enable-fts5
          make -j"$(nproc)"
          mkdir -p "$GITHUB_WORKSPACE/core/database-compat/src/androidTest/assets"
          printf '%s\n' "PRAGMA key = 'vvf-sqlcipher-compatibility-test';" "CREATE TABLE compatibility_test (id INTEGER PRIMARY KEY, value TEXT NOT NULL);" "INSERT INTO compatibility_test (id, value) VALUES (1, 'legacy-4.5.4');" ".quit" | ./sqlcipher "$GITHUB_WORKSPACE/core/database-compat/src/androidTest/assets/legacy-4.5.4.db"
          test -s "$GITHUB_WORKSPACE/core/database-compat/src/androidTest/assets/legacy-4.5.4.db"

      - name: Start Android emulator (HARD — no continue-on-error)
        timeout-minutes: 15
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          # Non-interactive AVD: explicit device profile + closed stdin (no hardware-profile prompt)
          avdmanager create avd \
            --force \
            --name vvf-api35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            </dev/null

          # Verify AVD was created
          if [ ! -d "$ANDROID_AVD_HOME/vvf-api35.avd" ] && [ ! -d "$HOME/.android/avd/vvf-api35.avd" ]; then
            echo "AVD creation failed. Listing available devices:"
            avdmanager list device || true
            ls -la "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/" || true
            exit 1
          fi

          if [ ! -e /dev/kvm ]; then
            echo "KVM is required for the hard SQLCipher gate; refusing to soft-skip emulator startup."
            cat "$RUNNER_TEMP/emulator.log" 2>/dev/null || true
            exit 1
          fi
          sudo chown "$USER" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

          adb start-server
          emulator -avd vvf-api35 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -accel on -no-metrics -wipe-data > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator.pid"
          timeout 180 adb wait-for-device
          for _ in $(seq 1 60); do
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$boot_completed" = "1" ]; then
              break
            fi
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"
          adb devices

      - name: SQLCipher instrumentation (HARD)
        run: ./gradlew --no-daemon :core:database:connectedDebugAndroidTest :core:database-compat:connectedDebugAndroidTest --stacktrace

      # Produce SHA-bound DB evidence on PRs too. Only scheduled/manual runs
      # update the persistent ledger; PR evidence remains an artifact for review.
      - name: Generate CPAS instrumented evidence
        if: success()
        run: |
          set -euo pipefail
          args=(
            --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}"
            --run-id "${{ github.run_id }}"
            --job-id "${{ github.job }}"
            --result PASS
            --include-db
            --environment "github-actions-API35-emulator-weekly"
            --output docs/assurance/cpas-evidence-weekly.json
          )
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            args+=(--merge-ledger)
          fi
          python3 tools/audit/generate_evidence.py "${args[@]}"

      - name: Upload weekly CPAS evidence artifacts
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: weekly-cpas-evidence
          path: |
            docs/assurance/cpas-evidence-weekly.json
            docs/assurance/evidence-ledger.json
          if-no-files-found: error
          retention-days: 30

      - name: Create PR with updated evidence ledger
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Check if evidence-ledger.json was modified
          if git diff --quiet docs/assurance/evidence-ledger.json; then
            echo "No changes to evidence-ledger.json, skipping PR"
            exit 0
          fi

          # Create a new branch
          BRANCH="auto/evidence-update-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"

          # Commit changes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/assurance/evidence-ledger.json
          git commit -m "chore(compliance): auto-update evidence ledger from weekly instrumented gate"

          # Push branch
          git push origin "$BRANCH"

          # Create PR
          gh pr create \
            --title "Auto-update evidence ledger (weekly instrumented gate)" \
            --body "Automated PR from Weekly Instrumented Hard Gate workflow.

          This PR updates \`docs/assurance/evidence-ledger.json\` with fresh evidence
          from the weekly SQLCipher instrumented test run.

          **Verification**: CPAS gate should PASS after merge.
          **Generated by**: GitHub Actions workflow run #${{ github.run_id }}" \
            --base main \
            --head "$BRANCH" \
            --label "compliance,automated"

          echo "Created PR with branch: $BRANCH"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: weekly-instrumented-diagnostics
          path: |
            ${{ runner.temp }}/emulator.log
            **/build/reports/androidTests/**
          if-no-files-found: ignore
          retention-days: 14
