name: Signed Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name"
        required: true
        type: string
      version_code:
        description: "Monotonically increasing Android version code"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

jobs:
  release:
    name: Build Signed Release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify protected release environment before mutations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/release" > "${RUNNER_TEMP}/release-environment.json"
          python3 tools/audit/verify_deployment_preflight.py \
            --environment release \
            --environment-file "${RUNNER_TEMP}/release-environment.json"

      - name: Require successful ORT evidence for this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly-ort.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=10" --jq '.workflow_runs[] | select(.head_sha == env.GITHUB_SHA) | .id' | head -n 1)"
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful nightly ORT scan exists for exact commit ${GITHUB_SHA}; run Nightly ORT Compliance Scan on this same commit and resolve all findings."
            exit 1
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name ort-results-evidence --dir ort-evidence
          test -s ort-evidence/ort-status.json || { echo "::error::ORT status artifact is missing"; exit 1; }
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          status = json.loads(Path("ort-evidence/ort-status.json").read_text(encoding="utf-8"))
          if status.get("status") != "PASS":
              raise SystemExit(f"ORT is not PASS: {status.get('status')!r}; {status.get('reason')!r}")
          if status.get("scan_revision") != os.environ["GITHUB_SHA"]:
              raise SystemExit("ORT evidence SHA does not match this release commit")
          PY
          python3 tools/audit/verify_ort_outputs.py --results-dir ort-evidence/results --revision "$GITHUB_SHA"
          mkdir -p docs/assurance
          cp ort-evidence/results/bom.cyclonedx.json docs/assurance/ort-bom.cyclonedx.json
          cp ort-evidence/results/bom.spdx.json docs/assurance/ort-bom.spdx.json
          cp ort-evidence/ort-status.json docs/assurance/ort-status.json
          cp ort-evidence/ort-status.json ort-status.json

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Require successful SQLCipher evidence for this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs_json="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/weekly-instrumented.yml/runs?per_page=100")"
          run_id="$(printf '%s' "$runs_json" | jq -r --arg sha "$GITHUB_SHA" '[.[] | .workflow_runs[]? | select(.head_sha == $sha or any(.pull_requests[]?; .head.sha == $sha)) | select(.status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::No successful Weekly Instrumented Hard Gate exists for exact release SHA ${GITHUB_SHA}; run it on this commit before release."
            exit 1
          fi

          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          job_id="$(printf '%s' "$jobs_json" | jq -r '[.jobs[] | select(.name == "SQLCipher Instrumented (hard)" and .conclusion == "success")] | last | .id // empty')"
          if [ -z "$job_id" ]; then
            echo "::error::Weekly run ${run_id} has no successful SQLCipher Instrumented (hard) job."
            exit 1
          fi

          # Download JUnit reports and their checkout-SHA manifest from this exact run.
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "sqlcipher-instrumented-${GITHUB_SHA}" --dir sqlcipher-reports
          python3 tools/audit/validate_instrumented_reports.py \
            --reports-dir sqlcipher-reports \
            --expected-sha "$GITHUB_SHA" \
            --expected-run-id "$run_id"

          python3 tools/audit/generate_evidence.py \
            --commit-sha "$GITHUB_SHA" \
            --run-id "$run_id" \
            --job-id "$job_id" \
            --result PASS \
            --include-db \
            --db-only \
            --environment "github-actions-API35-emulator-release" \
            --output docs/assurance/cpas-evidence-release.json \
            --merge-ledger

      - name: CPAS structural + semantic verification (hard fail)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/audit -p 'test_*.py' -v
          python3 tools/audit/cpas_verify.py --root .

      - name: Validate release inputs and secrets
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$VERSION_NAME" || { echo "version_name is required"; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "version_name must be SemVer-like (for example 1.2.3)"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "version_code must be a positive integer"; exit 1; }
          (( VERSION_CODE <= 2100000000 )) || { echo "version_code exceeds the configured Android safety limit"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is required"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret is required"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret is required"; exit 1; }
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "GOOGLE_SERVICES_JSON_BASE64 secret is required"; exit 1; }

      - name: Materialize signing and Firebase configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is required"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-upload-key.jks
          test -s release-upload-key.jks || { echo "Signing keystore is empty or invalid"; exit 1; }
          keytool -list -keystore release-upload-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s app/google-services.json || { echo "Firebase configuration is empty or invalid"; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("app/google-services.json").read_text())
          if not payload.get("project_info", {}).get("project_id"):
              raise SystemExit("google-services.json is missing project_info.project_id")
          if not payload.get("client"):
              raise SystemExit("google-services.json contains no Firebase client configuration")
          PY

      - name: Record instrumented DB evidence policy
        run: |
          echo "::notice::Unit tests and lint are hard on this release job."
          echo "::warning::SQLCipher connectedAndroidTest remains a weekly/self-hosted KVM hard gate — not soft-passed here."

      - name: Unit tests (release hard gate)
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Android lint (release hard gate)
        run: ./gradlew --no-daemon lintDebug --stacktrace

      - name: Assemble signed release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Verify signed APK + fingerprint + SHA-256
        id: apk
        run: |
          set -euo pipefail
          APK="$(find . -path '*/build/outputs/apk/release/*.apk' -type f | head -n 1)"
          test -n "$APK" || { echo "Signed release APK not found"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          CERT_FP="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" 2>/dev/null | grep -i 'SHA-256 digest' | head -n1 || true)"
          mkdir -p release-meta
          {
            echo "apk_path=$APK"
            echo "apk_sha256=$SHA"
            echo "cert_fingerprint=$CERT_FP"
            echo "version_name=${{ inputs.version_name }}"
            echo "version_code=${{ inputs.version_code }}"
            echo "git_sha=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
          } > release-meta/apk-manifest.txt
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          cat release-meta/apk-manifest.txt

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@2ed2d2006fea5d582c257dbad4532b1e4cbc8b83 # verified upstream commit
        with:
          file: ${{ steps.apk.outputs.path }}
          format: spdx-json
          output-file: release-meta/sbom.spdx.json

      - name: Fail-closed release gate (CPAS + ORT + APK)
        run: |
          set -euo pipefail
          python3 tools/audit/release_gate.py \
            --cpas-status cpas-status.json \
            --ort-status ort-status.json \
            --apk "${{ steps.apk.outputs.path }}"

      - name: Upload signed release APK + metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vvf-smartmanager-release-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            **/build/outputs/apk/release/*.apk
            release-meta/**
            cpas-status.json
            ort-status.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest release artifact (SLSA provenance)
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "**/build/outputs/apk/release/*.apk"

      - name: Remove signing and Firebase material
        if: always()
        run: rm -f release-upload-key.jks app/google-services.json
