name: Signed Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name"
        required: true
        type: string
      version_code:
        description: "Monotonically increasing Android version code"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build Signed Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Validate release inputs
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$VERSION_NAME" || { echo "version_name is required"; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "version_name must be SemVer-like (for example 1.2.3)"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "version_code must be a positive integer"; exit 1; }
          (( VERSION_CODE <= 2100000000 )) || { echo "version_code exceeds the configured Android safety limit"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is required"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret is required"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret is required"; exit 1; }

      - name: Materialize signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is required"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-upload-key.jks
          test -s release-upload-key.jks || { echo "Signing keystore is empty or invalid"; exit 1; }
          keytool -list -keystore release-upload-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Assemble signed release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          apk="$(find . -path '*/build/outputs/apk/release/*.apk' -type f -print -quit)"
          test -n "$apk" || { echo "Signed release APK not found"; exit 1; }
          apksigner verify --verbose "$apk"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: vvf-smartmanager-release-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: rm -f release-upload-key.jks
