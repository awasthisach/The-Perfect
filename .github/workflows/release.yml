name: Signed Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name"
        required: true
        type: string
      version_code:
        description: "Monotonically increasing Android version code"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  open_source_compliance:
    name: Open Source Compliance (ORT)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
    outputs:
      ort_status: ${{ steps.record_ort_status.outputs.status }}
      scan_revision: ${{ steps.record_ort_status.outputs.scan_revision }}
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # ORT's embedded Git/JGit downloader cannot use the ephemeral runner SSH agent.
      - name: Use HTTPS instead of SSH for GitHub source downloads
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
      - name: OSS Review Toolkit compliance gate (hard fail for release)
        id: ort
        uses: oss-review-toolkit/ort-ci-github-action@70149d4579e446b0312f8b80fdd8d465a91e4391 # pinned commit
        with:
          sw-name: The-Perfect
          sw-version: ${{ github.sha }}
          ort-config-revision: 5075f4308109384c98a6a2fab53246f7b60d59f4
          log-level: info
          # Enable project-scoped .ort.yml package curations; default ORT config disables them.
          # Preserve the action's overwrite/stacktrace defaults while enabling repo curations.
          ort-cli-args: -P ort.forceOverwrite=true --stacktrace -P ort.enableRepositoryPackageCurations=true
          run: >-
            cache-dependencies,
            cache-scan-results,
            labels,
            analyzer,
            scanner,
            evaluator,
            advisor,
            reporter,
            upload-results,
            upload-evaluation-result,
            upload-advisor-result,
            upload-scan-result
          fail-on: 'violations,issues'

      - name: Record ORT release gate status
        id: record_ort_status
        if: always()
        env:
          ORT_STEP_OUTCOME: ${{ steps.ort.outcome }}
          ORT_EVALUATOR_EXIT_CODE: ${{ steps.ort.outputs.evaluator-exit-code }}
          ORT_ADVISOR_EXIT_CODE: ${{ steps.ort.outputs.advisor-exit-code }}
          SCAN_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          outcome = os.environ.get("ORT_STEP_OUTCOME", "unknown")
          evaluator = os.environ.get("ORT_EVALUATOR_EXIT_CODE", "")
          advisor = os.environ.get("ORT_ADVISOR_EXIT_CODE", "")
          status = "PASS" if outcome == "success" and evaluator == "0" and advisor == "0" else "BLOCKED"
          result = {
              "gate_id": "GATE-LICENSE-001",
              "scanner": "OSS Review Toolkit (ORT)",
              "status": status,
              "scan_revision": os.environ["SCAN_REVISION"],
              "ort_action_outcome": outcome,
              "evaluator_exit_code": evaluator or None,
              "advisor_exit_code": advisor or None,
              "reason": "ORT evaluator and advisor completed successfully" if status == "PASS" else "ORT failed or reported policy/security findings; review ORT result artifacts"
          }
          Path("ort-status.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("status=" + status + "\n")
              output.write("scan_revision=" + os.environ["SCAN_REVISION"] + "\n")
          if status != "PASS":
              raise SystemExit(1)
          PY

  release:
    name: Build Signed Release
    needs: open_source_compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"

      - name: CPAS structural + semantic verification (hard fail)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/audit -p 'test_*.py' -v
          python3 tools/audit/cpas_verify.py --root .

      - name: Validate current-SHA ORT result from required compliance job
        env:
          ORT_STATUS: ${{ needs.open_source_compliance.outputs.ort_status }}
          ORT_SCAN_REVISION: ${{ needs.open_source_compliance.outputs.scan_revision }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          status = os.environ.get("ORT_STATUS", "")
          scanned = os.environ.get("ORT_SCAN_REVISION", "")
          release = os.environ["RELEASE_REVISION"]
          result = {
              "gate_id": "GATE-LICENSE-001",
              "scanner": "OSS Review Toolkit (ORT)",
              "status": status if status in {"PASS", "BLOCKED"} else "BLOCKED",
              "scan_revision": scanned,
              "release_revision": release,
              "reason": "ORT evaluator/advisor passed for this exact release SHA" if status == "PASS" and scanned == release else "ORT status is not PASS for the exact release SHA"
          }
          Path("ort-status.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result))
          if result["status"] != "PASS" or scanned != release:
              raise SystemExit("Release blocked: ORT must pass on the exact release SHA")
          PY

      - name: Validate release inputs and secrets
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$VERSION_NAME" || { echo "version_name is required"; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "version_name must be SemVer-like (for example 1.2.3)"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "version_code must be a positive integer"; exit 1; }
          (( VERSION_CODE <= 2100000000 )) || { echo "version_code exceeds the configured Android safety limit"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is required"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret is required"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret is required"; exit 1; }
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "GOOGLE_SERVICES_JSON_BASE64 secret is required"; exit 1; }

      - name: Materialize signing and Firebase configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is required"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-upload-key.jks
          test -s release-upload-key.jks || { echo "Signing keystore is empty or invalid"; exit 1; }
          keytool -list -keystore release-upload-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s app/google-services.json || { echo "Firebase configuration is empty or invalid"; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("app/google-services.json").read_text())
          project = payload.get("project_info", {})
          if project.get("project_id") != "thevvforg":
              raise SystemExit("Firebase project_id must match the configured Drive embedding Worker project (thevvforg)")
          if str(project.get("project_number", "")) != "1058219630435":
              raise SystemExit("Firebase project_number does not match the configured App Check project")
          clients = payload.get("client", [])
          expected_package = "com.vvf.smartmanager"
          matching = [
              client for client in clients
              if client.get("client_info", {}).get("android_client_info", {}).get("package_name") == expected_package
          ]
          if not matching:
              raise SystemExit(f"google-services.json has no Android client for {expected_package}")
          web_oauth_ids = []
          for client in matching:
              oauth = list(client.get("oauth_client", []))
              oauth += client.get("services", {}).get("appinvite_service", {}).get("other_platform_oauth_client", [])
              web_oauth_ids.extend(
                  item.get("client_id")
                  for item in oauth
                  if str(item.get("client_type", "")) == "3" and item.get("client_id")
              )
          if not web_oauth_ids:
              raise SystemExit("Firebase Android client has no web OAuth client (client_type=3) required for Google/Firebase sign-in")
          env_text = Path(".env.example").read_text()
          env_line = next((line for line in env_text.splitlines() if line.startswith("GOOGLE_WEB_CLIENT_ID=")), "")
          if not env_line:
              raise SystemExit(".env.example must define GOOGLE_WEB_CLIENT_ID for Google/Firebase sign-in")
          expected_web_id = env_line.split("=", 1)[1].strip().strip('"').strip("'")
          if not expected_web_id or expected_web_id not in web_oauth_ids:
              raise SystemExit("GOOGLE_WEB_CLIENT_ID in .env.example does not match any web OAuth client in google-services.json")
          PY

      - name: Generate SQLCipher 4.5.4 compatibility fixture
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev tcl-dev zlib1g-dev
          curl -fsSL -o /tmp/sqlcipher.tgz https://github.com/sqlcipher/sqlcipher/archive/refs/tags/v4.5.4.tar.gz
          tar -xzf /tmp/sqlcipher.tgz -C /tmp
          cd /tmp/sqlcipher-4.5.4
          ./configure --enable-tempstore=yes --enable-fts5 CFLAGS="-DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL" LDFLAGS="-lcrypto"
          make -j"$(nproc)"
          mkdir -p "$GITHUB_WORKSPACE/core/database-compat/src/androidTest/assets"
          printf '%s\n' "PRAGMA key = 'vvf-sqlcipher-compatibility-test';" "CREATE TABLE compatibility_test (id INTEGER PRIMARY KEY, value TEXT NOT NULL);" "INSERT INTO compatibility_test (id, value) VALUES (1, 'legacy-4.5.4');" ".quit" | ./sqlcipher "$GITHUB_WORKSPACE/core/database-compat/src/androidTest/assets/legacy-4.5.4.db"
          test -s "$GITHUB_WORKSPACE/core/database-compat/src/androidTest/assets/legacy-4.5.4.db"

      - name: Grant runner access to KVM
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chown "$(id -un)":kvm /dev/kvm
          sudo chmod 660 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Start Android emulator (hard release gate)
        timeout-minutes: 15
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/release-avd
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          echo "no" | avdmanager create avd --force --name vvf-release-api35 --package "system-images;android-35;google_apis;x86_64"
          adb start-server
          emulator -avd vvf-release-api35 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -accel on -no-metrics -wipe-data > "$RUNNER_TEMP/release-emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/release-emulator.pid"
          timeout 180 adb wait-for-device
          for _ in $(seq 1 60); do
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$boot_completed" = "1" ]; then break; fi
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"
          adb devices

      - name: SQLCipher compatibility instrumentation (hard release gate)
        timeout-minutes: 20
        run: ./gradlew --no-daemon :core:database-compat:connectedDebugAndroidTest --stacktrace

      - name: Stop release emulator
        if: always()
        run: |
          adb emu kill || true
          if [ -f "$RUNNER_TEMP/release-emulator.pid" ]; then kill "$(cat "$RUNNER_TEMP/release-emulator.pid")" 2>/dev/null || true; fi

      - name: Upload release emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-emulator-diagnostics
          path: |
            ${{ runner.temp }}/release-emulator.log
            **/build/reports/androidTests/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Unit tests (release hard gate)
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Android lint (release hard gate)
        run: ./gradlew --no-daemon lintDebug --stacktrace

      - name: Assemble signed release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease --stacktrace

      - name: Verify signed APK + fingerprint + SHA-256
        id: apk
        run: |
          set -euo pipefail
          APK="$(find . -path '*/build/outputs/apk/release/*.apk' -type f | head -n 1)"
          test -n "$APK" || { echo "Signed release APK not found"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          CERT_FP="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" 2>/dev/null | grep -i 'SHA-256 digest' | head -n1 || true)"
          test -n "$CERT_FP" || {
            echo "::error::APK signer SHA-256 certificate fingerprint could not be extracted"
            exit 1
          }
          mkdir -p release-meta
          {
            echo "apk_path=$APK"
            echo "apk_sha256=$SHA"
            echo "cert_fingerprint=$CERT_FP"
            echo "version_name=${{ inputs.version_name }}"
            echo "version_code=${{ inputs.version_code }}"
            echo "git_sha=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
          } > release-meta/apk-manifest.txt
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          cat release-meta/apk-manifest.txt

      - name: Verify signed Android App Bundle + SHA-256
        id: aab
        run: |
          set -euo pipefail
          AAB="$(find . -path '*/build/outputs/bundle/release/*.aab' -type f | head -n 1)"
          test -n "$AAB" || { echo "::error::Signed release AAB not found"; exit 1; }
          jarsigner -verify -verbose "$AAB" > /tmp/aab-signature-verification.log 2>&1
          grep -qi "jar verified" /tmp/aab-signature-verification.log || {
            cat /tmp/aab-signature-verification.log
            echo "::error::Android App Bundle signature verification failed"
            exit 1
          }
          SHA="$(sha256sum "$AAB" | awk '{print $1}')"
          mkdir -p release-meta
          {
            echo "aab_path=$AAB"
            echo "aab_sha256=$SHA"
            echo "git_sha=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
          } > release-meta/aab-manifest.txt
          echo "path=$AAB" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          cat release-meta/aab-manifest.txt

      - name: Generate SBOM for signed AAB
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ${{ steps.aab.outputs.path }}
          format: spdx-json
          output-file: release-meta/aab-sbom.spdx.json
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ${{ steps.apk.outputs.path }}
          format: spdx-json
          output-file: release-meta/sbom.spdx.json

      - name: Fail-closed release gate (CPAS + ORT + signed APK + signed AAB)
        run: |
          set -euo pipefail
          python3 tools/audit/release_gate.py \
            --cpas-status cpas-status.json \
            --ort-status ort-status.json \
            --apk "${{ steps.apk.outputs.path }}"

      - name: Upload signed release APK + metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vvf-smartmanager-release-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/bundle/release/*.aab
            release-meta/**
            cpas-status.json
            ort-status.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest release artifact (SLSA provenance)
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "**/build/outputs/apk/release/*.apk"
      - name: Attest Android App Bundle (SLSA provenance)
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "**/build/outputs/bundle/release/*.aab"

      - name: Remove signing and Firebase material
        if: always()
        run: rm -f release-upload-key.jks app/google-services.json
