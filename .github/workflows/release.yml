name: Signed Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name"
        required: true
        type: string
      version_code:
        description: "Monotonically increasing Android version code"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release:
    name: Build Signed Release
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"

      - name: CPAS structural + semantic verification (hard fail)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/audit -p 'test_*.py' -v
          python3 tools/audit/cpas_verify.py --root .

      - name: FOSSA license gate (hard fail for release)
        env:
          FOSSA_API_KEY: ${{ secrets.GH_FOSSA }}
        run: |
          set -euo pipefail
          if [ -z "${FOSSA_API_KEY:-}" ]; then
            cat > foss-status.json <<'EOF'
            {"gate_id":"GATE-LICENSE-001","status":"BLOCKED","reason":"GH_FOSSA missing for release"}
            EOF
            echo "::error::GH_FOSSA secret required for release promotion"
            exit 1
          fi
          FOSSA_VERSION="3.17.16"
          FOSSA_ARCHIVE="fossa_${FOSSA_VERSION}_linux_amd64.zip"
          FOSSA_BASE="https://github.com/fossas/fossa-cli/releases/download/v${FOSSA_VERSION}"
          curl --fail --show-error --silent --location --retry 3 "${FOSSA_BASE}/${FOSSA_ARCHIVE}" --output "/tmp/${FOSSA_ARCHIVE}"
          curl --fail --show-error --silent --location --retry 3 "${FOSSA_BASE}/${FOSSA_ARCHIVE}.sha256" --output "/tmp/${FOSSA_ARCHIVE}.sha256"
          (cd /tmp && sha256sum --check --strict "${FOSSA_ARCHIVE}.sha256")
          mkdir -p /tmp/fossa-cli
          unzip -q -o "/tmp/${FOSSA_ARCHIVE}" -d /tmp/fossa-cli
          test -x /tmp/fossa-cli/fossa || { echo "::error::Pinned FOSSA CLI binary missing"; exit 1; }
          sudo install -m 0755 /tmp/fossa-cli/fossa /usr/local/bin/fossa
          fossa --version
          fossa analyze --project "The-Perfect" --revision "${{ github.sha }}"
          fossa test --timeout 600
          cat > foss-status.json <<'EOF'
          {"gate_id":"GATE-LICENSE-001","status":"PASS","reason":"fossa analyze + fossa test succeeded on release"}
          EOF

      - name: Validate release inputs and secrets
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$VERSION_NAME" || { echo "version_name is required"; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "version_name must be SemVer-like (for example 1.2.3)"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "version_code must be a positive integer"; exit 1; }
          (( VERSION_CODE <= 2100000000 )) || { echo "version_code exceeds the configured Android safety limit"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is required"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret is required"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret is required"; exit 1; }
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "GOOGLE_SERVICES_JSON_BASE64 secret is required"; exit 1; }

      - name: Materialize signing and Firebase configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is required"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-upload-key.jks
          test -s release-upload-key.jks || { echo "Signing keystore is empty or invalid"; exit 1; }
          keytool -list -keystore release-upload-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s app/google-services.json || { echo "Firebase configuration is empty or invalid"; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("app/google-services.json").read_text())
          if not payload.get("project_info", {}).get("project_id"):
              raise SystemExit("google-services.json is missing project_info.project_id")
          if not payload.get("client"):
              raise SystemExit("google-services.json contains no Firebase client configuration")
          PY

      - name: Generate SQLCipher 4.5.4 compatibility fixture
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev tcl-dev zlib1g-dev
          curl -fsSL -o /tmp/sqlcipher.tgz https://github.com/sqlcipher/sqlcipher/archive/refs/tags/v4.5.4.tar.gz
          tar -xzf /tmp/sqlcipher.tgz -C /tmp
          cd /tmp/sqlcipher-4.5.4
          ./configure --enable-tempstore=yes --enable-fts5 CFLAGS="-DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL" LDFLAGS="-lcrypto"
          make -j"$(nproc)"
          mkdir -p "$GITHUB_WORKSPACE/core/database-compat/src/androidTest/assets"
          printf '%s\n' "PRAGMA key = 'vvf-sqlcipher-compatibility-test';" "CREATE TABLE compatibility_test (id INTEGER PRIMARY KEY, value TEXT NOT NULL);" "INSERT INTO compatibility_test (id, value) VALUES (1, 'legacy-4.5.4');" ".quit" | ./sqlcipher "$GITHUB_WORKSPACE/core/database-compat/src/androidTest/assets/legacy-4.5.4.db"
          test -s "$GITHUB_WORKSPACE/core/database-compat/src/androidTest/assets/legacy-4.5.4.db"

      - name: Grant runner access to KVM
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chown "$(id -un)":kvm /dev/kvm
          sudo chmod 660 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Start Android emulator (hard release gate)
        timeout-minutes: 15
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/release-avd
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          echo "no" | avdmanager create avd --force --name vvf-release-api35 --package "system-images;android-35;google_apis;x86_64"
          adb start-server
          emulator -avd vvf-release-api35 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -accel on -no-metrics -wipe-data > "$RUNNER_TEMP/release-emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/release-emulator.pid"
          timeout 180 adb wait-for-device
          for _ in $(seq 1 60); do
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$boot_completed" = "1" ]; then break; fi
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"
          adb devices

      - name: SQLCipher compatibility instrumentation (hard release gate)
        timeout-minutes: 20
        run: ./gradlew --no-daemon :core:database-compat:connectedDebugAndroidTest --stacktrace

      - name: Stop release emulator
        if: always()
        run: |
          adb emu kill || true
          if [ -f "$RUNNER_TEMP/release-emulator.pid" ]; then kill "$(cat "$RUNNER_TEMP/release-emulator.pid")" 2>/dev/null || true; fi

      - name: Upload release emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-emulator-diagnostics
          path: |
            ${{ runner.temp }}/release-emulator.log
            **/build/reports/androidTests/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Unit tests (release hard gate)
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Android lint (release hard gate)
        run: ./gradlew --no-daemon lintDebug --stacktrace

      - name: Assemble signed release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Verify signed APK + fingerprint + SHA-256
        id: apk
        run: |
          set -euo pipefail
          APK="$(find . -path '*/build/outputs/apk/release/*.apk' -type f | head -n 1)"
          test -n "$APK" || { echo "Signed release APK not found"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          CERT_FP="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" 2>/dev/null | grep -i 'SHA-256 digest' | head -n1 || true)"
          mkdir -p release-meta
          {
            echo "apk_path=$APK"
            echo "apk_sha256=$SHA"
            echo "cert_fingerprint=$CERT_FP"
            echo "version_name=${{ inputs.version_name }}"
            echo "version_code=${{ inputs.version_code }}"
            echo "git_sha=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
          } > release-meta/apk-manifest.txt
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          cat release-meta/apk-manifest.txt

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          file: ${{ steps.apk.outputs.path }}
          format: spdx-json
          output-file: release-meta/sbom.spdx.json

      - name: Fail-closed release gate (CPAS + FOSSA + APK)
        run: |
          set -euo pipefail
          python3 tools/audit/release_gate.py \
            --cpas-status cpas-status.json \
            --foss-status foss-status.json \
            --apk "${{ steps.apk.outputs.path }}"

      - name: Upload signed release APK + metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vvf-smartmanager-release-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            **/build/outputs/apk/release/*.apk
            release-meta/**
            cpas-status.json
            foss-status.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest release artifact (SLSA provenance)
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "**/build/outputs/apk/release/*.apk"

      - name: Remove signing and Firebase material
        if: always()
        run: rm -f release-upload-key.jks app/google-services.json
