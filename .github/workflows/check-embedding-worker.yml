name: Embedding Worker Build Gate

on:
  pull_request:
    paths:
      - "cloudflare/drive-semantic-embed/**"
      - ".github/workflows/check-embedding-worker.yml"
      - ".github/workflows/deploy-embedding-worker.yml"
  push:
    branches:
      - main
      - "fix/drive-semantic-search-product-alignment"
    paths:
      - "cloudflare/drive-semantic-embed/**"
      - ".github/workflows/check-embedding-worker.yml"
      - ".github/workflows/deploy-embedding-worker.yml"

permissions:
  contents: read

concurrency:
  group: embedding-worker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.149.0

      - name: Bundle and validate Worker without deploying
        run: wrangler deploy --dry-run --config cloudflare/drive-semantic-embed/wrangler.toml
