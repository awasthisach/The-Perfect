# Final consolidation workflow: main is the canonical branch.
name: Cleanup Stale Branches

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  delete-stale:
    name: Consolidate repository branches
    runs-on: ubuntu-24.04
    steps:
      - name: Delete every non-main branch after final main consolidation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Final branch consolidation for $REPOSITORY"
          mapfile -t branches < <(
            gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" --jq '.[].name'
          )
          for branch in "${branches[@]}"; do
            if [ "$branch" = "main" ]; then
              continue
            fi
            echo "Deleting stale branch: $branch"
            gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${branch}"
          done
          echo "Branch consolidation complete. main is the canonical branch."
