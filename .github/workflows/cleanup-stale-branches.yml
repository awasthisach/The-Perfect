name: Cleanup Stale Branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branches=(
            audit-fixes
            docs/readme-try-apk
            docs/setup-hindi
            docs-prod-final
            docs-prod-status-bio
            feat/grok-style-cloud-login
            fix/audit-findings-2026-09-06
            fix/explorer-oauth-wire
            fix/explorer-permission-resume
            fix/perf-index-semantic-lag
            fix/perf-lag-minimal
            prod-bio-final
            prod-bio-v3
            prod-biometric-crypto-workers
            prod-biometric-cryptoobject
            prod-biometric-safe
            prod-cloud-backup-runtime
            prod-final-hardening
            prod-hardening-next
            prod-v2-complete
            prod-wire-junk-ocr
            chore/delete-stale-branches-marker
          )
          for b in "${branches[@]}"; do
            echo "Deleting branch: $b"
            # URL-encode path segments for branch names with /
            encoded=$(printf '%s' "$b" | sed 's|/|%2F|g')
            code=$(curl -s -o /tmp/del_out -w "%{http_code}" -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/${encoded}")
            echo "  HTTP $code"
            cat /tmp/del_out || true
            echo
          done
          echo "Done."
