name: VVF Smart Manager CI & Quality Gate

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  test_and_coverage:
    name: Unit Tests, JaCoCo Coverage & Codecov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Restore missing Gradle wrapper JAR
        if: ${{ !hashFiles('gradle/wrapper/gradle-wrapper.jar') }}
        run: |
          mkdir -p gradle/wrapper
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar \
            --output gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.jar
      - name: Verify Gradle wrapper
        run: |
          test -x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          ./gradlew --version
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - name: Run Unit Tests across all modules
        run: ./gradlew testDebugUnitTest --continue --stacktrace
      - name: Generate Android unit-test coverage report
        run: ./gradlew :app:createDebugUnitTestCoverageReport --stacktrace
      - name: Verify coverage reports exist
        run: |
          find . -type f -path '*/build/reports/coverage/*' -name '*.xml' -print -quit | grep -q . || {
            echo "ERROR: No Android unit-test JaCoCo XML coverage report was generated."
            exit 1
          }
      - name: Upload Coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: "**/build/reports/coverage/**/*.xml"
          fail_ci_if_error: true
          verbose: true
      - name: Archive Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  license_compliance:
    name: FOSSA & Open Source License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Run FOSSA License Scan
        uses: fossas/fossa-action@v2
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          run-tests: true

  build_and_release:
    name: Build & Assemble Release
    needs: [test_and_coverage, license_compliance]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Restore missing Gradle wrapper JAR
        if: ${{ !hashFiles('gradle/wrapper/gradle-wrapper.jar') }}
        run: |
          mkdir -p gradle/wrapper
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar \
            --output gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.jar
      - name: Verify Gradle wrapper
        run: |
          test -x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          ./gradlew --version
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - name: Verify required Firebase configuration
        run: |
          test -f app/google-services.json || {
            echo "ERROR: app/google-services.json is required for release CI."
            exit 1
          }
      - name: Verify production signing configuration
        run: |
          test -n "$KEYSTORE_PATH" || { echo "ERROR: KEYSTORE_PATH is missing"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ERROR: STORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: KEY_ALIAS is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: KEY_PASSWORD is missing"; exit 1; }
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Build All Modules and Assemble Release
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Archive Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vvf-smartmanager-release-apk
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: error
