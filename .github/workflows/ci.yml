name: VVF Smart Manager CI & Quality Gate

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test_and_coverage:
    name: Unit Tests, JaCoCo Coverage & Codecov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Run Unit Tests across all modules
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            **/build/reports/jacoco/**/*.xml
            **/build/reports/jacoco/testDebugUnitTestCoverage/testDebugUnitTestCoverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Archive Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/"

  license_compliance:
    name: FOSSA & Open Source License Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run FOSSA License Scan
        uses: fossas/fossa-action@v1
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          run-tests: true
        continue-on-error: true # Allow PR builds to succeed even if token is not yet provisioned

  build_and_release:
    name: Build & Assemble Release
    needs: [test_and_coverage]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build All Modules and Assemble Release
        run: ./gradlew assembleRelease --stacktrace

      - name: Archive Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vvf-smartmanager-release-apk
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: ignore
