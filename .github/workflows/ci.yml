name: VVF Smart Manager CI & Quality Gate
# Candidate workflow: ORT is the active license-compliance gate; FOSSA is retired.

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  UPLOAD_ARTIFACT_ACTION: b7c566a772e6b6bfb58ed0dc250532a479d7789f

jobs:
  test_and_quality:
    name: Build, Test, Lint & Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ""
          accept-android-sdk-licenses: true
      - name: Install required Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties
      - name: Verify Gradle wrapper
        run: ./gradlew --no-daemon --version
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace
      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug --stacktrace
      - name: Resolve release runtime dependency graph
        run: ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath --console=plain > release-runtime-dependencies.txt
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Generate CPAS unit evidence
        if: success()
        run: |
          set -euo pipefail
          python3 tools/audit/generate_evidence.py --commit-sha "${{ github.sha }}" --run-id "${{ github.run_id }}" --job-id "${{ github.job }}" --result PASS --environment "github-actions-${{ runner.os }}-unit" --output docs/assurance/cpas-evidence-run.json
      - name: Upload CPAS unit evidence
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cpas-evidence-run
          path: docs/assurance/cpas-evidence-run.json
          if-no-files-found: error
          retention-days: 30
      - name: Start Android emulator (soft infra gate)
        id: emulator
        timeout-minutes: 12
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
        run: |
          set -uo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          echo "no" | avdmanager create avd --force --name vvf-api35 --package "system-images;android-35;google_apis;x86_64" --device "pixel_2" || { echo "booted=false" >> "$GITHUB_OUTPUT"; echo "::warning::AVD creation failed; emulator infrastructure unavailable."; exit 0; }
          adb start-server || true
          emulator -avd vvf-api35 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -accel off -no-metrics -wipe-data > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator.pid"
          if ! timeout 180 adb wait-for-device; then
            echo "::warning::adb wait-for-device timed out; treating emulator as an infrastructure skip."
            tail -n 80 "$RUNNER_TEMP/emulator.log" || true
            echo "booted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for _ in $(seq 1 60); do
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            [ "$boot_completed" = "1" ] && break
            sleep 5
          done
          if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" != "1" ]; then
            echo "::warning::Emulator failed to reach sys.boot_completed=1; treating as infrastructure skip."
            tail -n 120 "$RUNNER_TEMP/emulator.log" || true
            echo "booted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb devices
          echo "booted=true" >> "$GITHUB_OUTPUT"
      - name: Annotate SQLCipher instrumented skip
        if: ${{ steps.emulator.outputs.booted != 'true' }}
        run: echo "::warning::GATE-DB-001 emulator did not boot — SQLCipher instrumentation SKIPPED (soft). Weekly instrumented workflow remains the hard DB gate."
      - name: Run SQLCipher compatibility instrumentation test
        id: sqlcipher_instrumented
        if: ${{ steps.emulator.outputs.booted == 'true' }}
        run: ./gradlew --no-daemon :core:database-compat:connectedDebugAndroidTest --stacktrace
      - name: Generate CPAS full DB evidence
        if: ${{ steps.emulator.outputs.booted == 'true' && steps.sqlcipher_instrumented.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 tools/audit/generate_evidence.py --commit-sha "${{ github.sha }}" --run-id "${{ github.run_id }}" --job-id "${{ github.job }}" --result PASS --include-db --environment "github-actions-API35-emulator" --output docs/assurance/cpas-evidence-full.json
      - name: Publish gate summary
        if: always()
        run: |
          echo "## CI gate policy" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Policy |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit tests / lint / assemble | HARD — must pass |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Emulator boot | SOFT — infrastructure failure recorded without failing the job |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SQLCipher instrumented after boot | HARD — failure fails the job |" >> "$GITHUB_STEP_SUMMARY"
          echo "Emulator booted: ${{ steps.emulator.outputs.booted || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Instrumented outcome: ${{ steps.sqlcipher_instrumented.outcome || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Stop Android emulator
        if: always()
        timeout-minutes: 1
        run: |
          set +e
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          timeout 10 adb emu kill 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/emulator.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/emulator.pid")" 2>/dev/null || true
            sleep 1
            kill -9 "$(cat "$RUNNER_TEMP/emulator.pid")" 2>/dev/null || true
          fi
          timeout 10 adb kill-server 2>/dev/null || true
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-test-reports
          path: "**/build/reports/androidTests/**"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-emulator-diagnostics
          path: |
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload release runtime dependency graph
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-runtime-dependency-graph
          path: release-runtime-dependencies.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload full CPAS evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cpas-evidence-full
          path: docs/assurance/cpas-evidence-full.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vvf-smartmanager-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7

  open_source_compliance:
    name: Open Source Compliance (ORT)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Use HTTPS instead of SSH for GitHub source downloads
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
      - name: Run OSS Review Toolkit (license, source scan, vulnerability and policy checks)
        id: ort
        uses: oss-review-toolkit/ort-ci-github-action@70149d4579e446b0312f8b80fdd8d465a91e4391
        with:
          sw-name: The-Perfect
          sw-version: ${{ github.sha }}
          ort-config-revision: 5075f4308109384c98a6a2fab53246f7b60d59f4
          ort-cli-args: -P ort.enableRepositoryPackageCurations=true
          run: >-
            cache-dependencies,
            labels,
            analyzer,
            scanner,
            evaluator,
            advisor,
            reporter,
            upload-results,
            upload-evaluation-result,
            upload-advisor-result,
            upload-scan-result
          fail-on: 'violations,issues'

      - name: Record OSS compliance gate status
        if: always()
        env:
          ORT_STEP_OUTCOME: ${{ steps.ort.outcome }}
          ORT_EVALUATOR_EXIT_CODE: ${{ steps.ort.outputs.evaluator-exit-code }}
          ORT_ADVISOR_EXIT_CODE: ${{ steps.ort.outputs.advisor-exit-code }}
          SCAN_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          outcome = os.environ.get("ORT_STEP_OUTCOME", "unknown")
          evaluator = os.environ.get("ORT_EVALUATOR_EXIT_CODE", "")
          advisor = os.environ.get("ORT_ADVISOR_EXIT_CODE", "")
          # Upstream ORT action may emit empty advisor-exit-code (output name bug).
          advisor_ok = advisor in ("0", "", "null", "None")
          status = "PASS" if outcome == "success" and evaluator == "0" and advisor_ok else "BLOCKED"
          result = {
              "gate_id": "GATE-LICENSE-001",
              "scanner": "OSS Review Toolkit (ORT)",
              "status": status,
              "scan_revision": os.environ["SCAN_REVISION"],
              "ort_action_outcome": outcome,
              "evaluator_exit_code": evaluator or None,
              "advisor_exit_code": advisor or None,
              "advisor_exit_code_note": "empty advisor code treated as OK when ort step succeeded (upstream action bug workaround)",
              "reason": "ORT evaluator completed successfully; advisor gated by step outcome" if status == "PASS" else "ORT failed or reported policy/security findings; review ORT result artifacts"
          }
          Path("ort-status.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result))
          if status != "PASS":
              raise SystemExit(1)
          PY

      - name: Upload OSS compliance gate status
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ort-status
          path: ort-status.json
          if-no-files-found: error
          retention-days: 30
