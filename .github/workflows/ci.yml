name: VVF Smart Manager CI & Quality Gate

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test_and_coverage:
    name: Unit Tests, JaCoCo Coverage & Codecov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Restore missing Gradle wrapper JAR
        if: ${{ !hashFiles('gradle/wrapper/gradle-wrapper.jar') }}
        run: |
          mkdir -p gradle/wrapper
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar \
            --output gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Verify Gradle wrapper
        run: |
          test -x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          ./gradlew --version

      - name: Run Unit Tests across all modules
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Upload Coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            **/build/reports/jacoco/**/*.xml
            **/build/reports/jacoco/testDebugUnitTestCoverage/testDebugUnitTestCoverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Archive Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  license_compliance:
    name: FOSSA & Open Source License Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run FOSSA License Scan
        uses: fossas/fossa-action@v1
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          run-tests: true
        continue-on-error: true

  build_and_release:
    name: Build & Assemble Release
    needs: [test_and_coverage]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Restore missing Gradle wrapper JAR
        if: ${{ !hashFiles('gradle/wrapper/gradle-wrapper.jar') }}
        run: |
          mkdir -p gradle/wrapper
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar \
            --output gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Verify Gradle wrapper
        run: |
          test -x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          ./gradlew --version

      - name: Build All Modules and Assemble Release
        run: ./gradlew assembleRelease --stacktrace

      - name: Archive Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vvf-smartmanager-release-apk
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: ignore
