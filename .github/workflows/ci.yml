name: VVF Smart Manager CI & Quality Gate

on:
  push:
    branches: ["main", "develop", "fix/drive-semantic-search-product-alignment"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  UPLOAD_ARTIFACT_ACTION: b7c566a772e6b6bfb58ed0dc250532a479d7789f

jobs:
  test_and_quality:
    name: Build, Test, Lint & Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          accept-android-sdk-licenses: true
      - name: Install required Android SDK components
        # Keep the PR gate focused on deterministic compile/test/lint/build work.
        # Emulator packages are installed only by weekly-instrumented.yml, the hard SQLCipher gate.
        # The emulator step below is intentionally soft and records a skip when its image is absent.
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties
      # SQLCipher fixture generation is only needed by connectedAndroidTest.
      # This PR job intentionally has no emulator; the weekly hard gate builds the fixture
      # immediately before instrumentation in weekly-instrumented.yml.
      - name: Verify Gradle wrapper
        run: ./gradlew --no-daemon --version
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace
      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug --stacktrace
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Generate CPAS unit evidence
        if: success()
        run: |
          set -euo pipefail
          python3 tools/audit/generate_evidence.py --commit-sha "${{ github.sha }}" --run-id "${{ github.run_id }}" --job-id "${{ github.job }}" --result PASS --environment "github-actions-${{ runner.os }}-unit" --output docs/assurance/cpas-evidence-run.json
      - name: Upload CPAS unit evidence
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cpas-evidence-run
          path: docs/assurance/cpas-evidence-run.json
          if-no-files-found: error
          retention-days: 30

      # Emulator boot is deliberately SOFT because GitHub-hosted runners may lack KVM.
      # The step exits successfully on infra failure and exposes booted=false, so no red
      # error annotation is produced. Instrumentation remains HARD when boot succeeds.
      - name: Start Android emulator (soft infra gate)
        id: emulator
        timeout-minutes: 12
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
        run: |
          set -uo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          echo "no" | avdmanager create avd --force --name vvf-api35 --package "system-images;android-35;google_apis;x86_64" --device "pixel_2" || { echo "booted=false" >> "$GITHUB_OUTPUT"; echo "::warning::AVD creation failed; emulator infrastructure unavailable."; exit 0; }
          adb start-server || true
          emulator -avd vvf-api35 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -accel off -no-metrics -wipe-data > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator.pid"
          if ! timeout 180 adb wait-for-device; then
            echo "::warning::adb wait-for-device timed out; treating emulator as an infrastructure skip."
            tail -n 80 "$RUNNER_TEMP/emulator.log" || true
            echo "booted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for _ in $(seq 1 60); do
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            [ "$boot_completed" = "1" ] && break
            sleep 5
          done
          if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" != "1" ]; then
            echo "::warning::Emulator failed to reach sys.boot_completed=1; treating as infrastructure skip."
            tail -n 120 "$RUNNER_TEMP/emulator.log" || true
            echo "booted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb devices
          echo "booted=true" >> "$GITHUB_OUTPUT"
      - name: Annotate SQLCipher instrumented skip
        if: ${{ steps.emulator.outputs.booted != 'true' }}
        run: echo "::warning::GATE-DB-001 emulator did not boot — SQLCipher instrumentation SKIPPED (soft). Weekly instrumented workflow remains the hard DB gate."
      - name: Run SQLCipher compatibility instrumentation test
        id: sqlcipher_instrumented
        if: ${{ steps.emulator.outputs.booted == 'true' }}
        run: ./gradlew --no-daemon :core:database-compat:connectedDebugAndroidTest --stacktrace
      - name: Generate CPAS full DB evidence
        if: ${{ steps.emulator.outputs.booted == 'true' && steps.sqlcipher_instrumented.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 tools/audit/generate_evidence.py --commit-sha "${{ github.sha }}" --run-id "${{ github.run_id }}" --job-id "${{ github.job }}" --result PASS --include-db --environment "github-actions-API35-emulator" --output docs/assurance/cpas-evidence-full.json
      - name: Publish gate summary
        if: always()
        run: |
          echo "## CI gate policy" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Policy |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit tests / lint / assemble | HARD — must pass |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Emulator boot | SOFT — infrastructure failure recorded without failing the job |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SQLCipher instrumented after boot | HARD — failure fails the job |" >> "$GITHUB_STEP_SUMMARY"
          echo "Emulator booted: ${{ steps.emulator.outputs.booted || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Instrumented outcome: ${{ steps.sqlcipher_instrumented.outcome || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Stop Android emulator
        if: always()
        timeout-minutes: 1
        run: |
          set +e
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          timeout 10 adb emu kill 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/emulator.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/emulator.pid")" 2>/dev/null || true
            sleep 1
            kill -9 "$(cat "$RUNNER_TEMP/emulator.pid")" 2>/dev/null || true
          fi
          timeout 10 adb kill-server 2>/dev/null || true
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-test-reports
          path: "**/build/reports/androidTests/**"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-emulator-diagnostics
          path: |
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload full CPAS evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cpas-evidence-full
          path: docs/assurance/cpas-evidence-full.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vvf-smartmanager-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7

  license_compliance:
    name: Open Source License Compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FOSSA_ENABLED: ${{ secrets.GH_FOSSA != '' }}
      FOSSA_API_KEY: ${{ secrets.GH_FOSSA }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Block missing FOSSA credential
        if: ${{ env.FOSSA_ENABLED != 'true' }}
        run: |
          cat > foss-status.json <<'EOF'
          {"gate_id":"GATE-LICENSE-001","status":"BLOCKED","reason":"GH_FOSSA secret is not configured"}
          EOF
          echo "::error::GH_FOSSA missing — license compliance cannot be verified; CI is blocked."
          exit 1
      - name: Install FOSSA CLI
        if: ${{ env.FOSSA_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          FOSSA_VERSION="3.17.16"
          FOSSA_ARCHIVE="fossa_${FOSSA_VERSION}_linux_amd64.zip"
          FOSSA_BASE="https://github.com/fossas/fossa-cli/releases/download/v${FOSSA_VERSION}"
          curl --fail --show-error --silent --location --retry 3 "${FOSSA_BASE}/${FOSSA_ARCHIVE}" --output "/tmp/${FOSSA_ARCHIVE}"
          curl --fail --show-error --silent --location --retry 3 "${FOSSA_BASE}/${FOSSA_ARCHIVE}.sha256" --output "/tmp/${FOSSA_ARCHIVE}.sha256"
          (cd /tmp && sha256sum --check --strict "${FOSSA_ARCHIVE}.sha256")
          mkdir -p /tmp/fossa-cli
          unzip -q -o "/tmp/${FOSSA_ARCHIVE}" -d /tmp/fossa-cli
          test -x /tmp/fossa-cli/fossa || { echo "::error::Pinned FOSSA CLI binary missing"; exit 1; }
          sudo install -m 0755 /tmp/fossa-cli/fossa /usr/local/bin/fossa
          fossa --version
      - name: FOSSA analyze
        id: fossa_analyze
        if: ${{ env.FOSSA_ENABLED == 'true' }}
        env:
          FOSSA_API_KEY: ${{ secrets.GH_FOSSA }}
          GRADLE_OPTS: -Dorg.gradle.configuration-cache=false
        run: fossa analyze --project "The-Perfect" --revision "${{ github.sha }}"
      - name: FOSSA policy and findings test
        id: fossa_test
        if: ${{ env.FOSSA_ENABLED == 'true' && success() }}
        continue-on-error: true
        env:
          FOSSA_API_KEY: ${{ secrets.GH_FOSSA }}
        run: fossa test --timeout 600
      - name: Record FOSSA gate status
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ "${{ env.FOSSA_ENABLED }}" != "true" ]; then
            exit 0
          fi
          ANALYZE="${{ steps.fossa_analyze.outcome }}"
          TEST="${{ steps.fossa_test.outcome }}"
          if [ "$ANALYZE" = "success" ] && [ "$TEST" = "success" ]; then
            echo '{"gate_id":"GATE-LICENSE-001","status":"PASS","reason":"fossa analyze and fossa test both succeeded"}' > foss-status.json
          elif [ "$ANALYZE" != "success" ]; then
            echo '{"gate_id":"GATE-LICENSE-001","status":"BLOCKED","reason":"FOSSA analyze failed"}' > foss-status.json
            echo "::error::FOSSA analyze failed; license gate is BLOCKED."
            exit 1
          else
            echo '{"gate_id":"GATE-LICENSE-001","status":"BLOCKED","reason":"FOSSA test reported unresolved policy or dependency findings; review and triage them in the FOSSA project before release"}' > foss-status.json
            echo "::error::FOSSA test reported unresolved findings; release gate is BLOCKED until findings are reviewed and triaged."
            exit 1
          fi
      - name: Upload FOSSA gate status
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: foss-status
          path: foss-status.json
          if-no-files-found: error
          retention-days: 30
