name: VVF Smart Manager CI & Quality Gate

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize validation per branch without cancelling an active run. GitHub may replace
  # a pending run with a newer revision, avoiding redundant concurrent Android/emulator builds.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UPLOAD_ARTIFACT_ACTION: b7c566a772e6b6bfb58ed0dc250532a479d7789f

jobs:
  test_and_quality:
    name: Build, Test, Lint & Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          accept-android-sdk-licenses: true
      - name: Install required Android SDK components
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          test -d "$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties
      - name: Generate SQLCipher 4.5.4 compatibility fixture
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev tcl-dev zlib1g-dev
          mkdir -p core/database-compat/src/androidTest/assets
          # Pin SQLCipher source archive to the independently reviewed v4.5.4 SHA-256.
          curl -fsSL https://github.com/sqlcipher/sqlcipher/archive/refs/tags/v4.5.4.tar.gz -o /tmp/sqlcipher-4.5.4.tar.gz
          ACTUAL_SHA256="$(sha256sum /tmp/sqlcipher-4.5.4.tar.gz | awk '{print $1}')"
          EXPECTED_SHA256="ea052fe634d729f9dd6b624016104de796faf87e487a9e868a07faee35957771"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::SQLCipher v4.5.4 source archive SHA-256 mismatch: expected $EXPECTED_SHA256, got $ACTUAL_SHA256"
            exit 1
          fi
          echo "SQLCipher 4.5.4 tarball sha256=$ACTUAL_SHA256"
          test -s /tmp/sqlcipher-4.5.4.tar.gz
          test "$(stat -c%s /tmp/sqlcipher-4.5.4.tar.gz)" -gt 100000
          tar -xzf /tmp/sqlcipher-4.5.4.tar.gz -C /tmp
          cd /tmp/sqlcipher-4.5.4
          ./configure --enable-tempstore=yes --enable-fts5 CFLAGS="-DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL" LDFLAGS="-lcrypto"
          make -j2
          test -x ./sqlcipher
          printf '%s\n' "PRAGMA key = 'vvf-sqlcipher-compatibility-test';" "CREATE TABLE compatibility_test (id INTEGER PRIMARY KEY, value TEXT NOT NULL);" "INSERT INTO compatibility_test (id, value) VALUES (1, 'legacy-4.5.4');" ".quit" | ./sqlcipher "$GITHUB_WORKSPACE/core/database-compat/src/androidTest/assets/legacy-4.5.4.db"
          test -s "$GITHUB_WORKSPACE/core/database-compat/src/androidTest/assets/legacy-4.5.4.db"
      - name: Run ORT report validator unit tests
        run: python3 -m unittest discover -s tools/audit -p 'test_*.py' -v
      - name: Verify Gradle wrapper
        run: ./gradlew --no-daemon --console=plain --warning-mode=all --version
      - name: Run unit tests
        run: ./gradlew --no-daemon --console=plain --warning-mode=all testDebugUnitTest --stacktrace
      - name: Run Android lint
        run: ./gradlew --no-daemon --console=plain --warning-mode=all lintDebug --stacktrace
      - name: Assemble debug APK
        run: ./gradlew --no-daemon --console=plain --warning-mode=all assembleDebug --stacktrace
      - name: Extract debug APK signing SHA-1
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          cert_output="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk")"
          raw_sha1="$(printf '%s\n' "$cert_output" | sed -nE 's/.*certificate SHA-1 digest: ([[:xdigit:]:]+).*/\1/p' | head -n 1)"
          compact_sha1="${raw_sha1//:/}"
          compact_sha1="${compact_sha1^^}"
          if [[ ! "$compact_sha1" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::Could not extract a valid 20-byte signing certificate SHA-1 from $apk"
            printf '%s\n' "$cert_output"
            exit 1
          fi
          sha1="$(printf '%s' "$compact_sha1" | sed -E 's/(..)/\1:/g; s/:$//')"
          echo "Debug APK signing certificate SHA-1: $sha1"
          echo "Debug APK SHA-1: `$sha1`" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate CPAS unit evidence
        if: success()
        run: |
          set -euo pipefail
          python3 tools/audit/generate_evidence.py --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}" --run-id "${{ github.run_id }}" --job-id "${{ github.job }}" --result PASS --environment "github-actions-${{ runner.os }}-unit" --output docs/assurance/cpas-evidence-run.json
      - name: Upload CPAS unit evidence
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cpas-evidence-run
          path: docs/assurance/cpas-evidence-run.json
          if-no-files-found: error
          retention-days: 30

      # Emulator boot is deliberately SOFT because GitHub-hosted runners may lack KVM.
      # The step exits successfully on infra failure and exposes booted=false, so no red
      # error annotation is produced. Instrumentation remains HARD when boot succeeds.
      - name: Start Android emulator (soft infra gate)
        id: emulator
        timeout-minutes: 12
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
        run: |
          set -uo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          if ! "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name vvf-api35 --package "system-images;android-35;google_apis;x86_64" --device "pixel_2" </dev/null; then
            echo "booted=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AVD creation failed; emulator infrastructure unavailable."
            exit 0
          fi
          # GitHub-hosted runners may expose /dev/kvm without granting the runner user access.
          # Grant access on this ephemeral runner; fall back explicitly when KVM is unavailable.
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm || true
          fi
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            accel_args=()
            echo "KVM is accessible; Android emulator will use hardware acceleration."
          else
            accel_args=(-accel off)
            echo "::warning::KVM is unavailable; Android emulator will use software emulation."
          fi
          adb start-server || true
          emulator -avd vvf-api35 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none "${accel_args[@]}" -no-metrics -wipe-data > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator.pid"
          if ! timeout 300 adb wait-for-device; then
            echo "::warning::adb wait-for-device timed out; treating emulator as an infrastructure skip."
            tail -n 80 "$RUNNER_TEMP/emulator.log" || true
            echo "booted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for _ in $(seq 1 60); do
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            [ "$boot_completed" = "1" ] && break
            sleep 5
          done
          if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" != "1" ]; then
            echo "::warning::Emulator failed to reach sys.boot_completed=1; treating as infrastructure skip."
            tail -n 120 "$RUNNER_TEMP/emulator.log" || true
            echo "booted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb devices
          echo "booted=true" >> "$GITHUB_OUTPUT"
      - name: Annotate SQLCipher instrumented skip
        if: ${{ steps.emulator.outputs.booted != 'true' }}
        run: echo "::warning::GATE-DB-001 emulator did not boot — SQLCipher instrumentation SKIPPED (soft). Weekly instrumented workflow remains the hard DB gate."
      - name: Run SQLCipher compatibility instrumentation test
        id: sqlcipher_instrumented
        if: ${{ steps.emulator.outputs.booted == 'true' }}
        run: ./gradlew --no-daemon :core:database-compat:connectedDebugAndroidTest --stacktrace
      - name: Generate CPAS full DB evidence
        if: ${{ steps.emulator.outputs.booted == 'true' && steps.sqlcipher_instrumented.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 tools/audit/generate_evidence.py --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}" --run-id "${{ github.run_id }}" --job-id "${{ github.job }}" --result PASS --include-db --environment "github-actions-API35-emulator" --output docs/assurance/cpas-evidence-full.json
      - name: Publish gate summary
        if: always()
        run: |
          echo "## CI gate policy" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Policy |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit tests / lint / assemble | HARD — must pass |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Emulator boot | SOFT — infrastructure failure recorded without failing the job |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SQLCipher instrumented after boot | HARD — failure fails the job |" >> "$GITHUB_STEP_SUMMARY"
          echo "Emulator booted: ${{ steps.emulator.outputs.booted || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Instrumented outcome: ${{ steps.sqlcipher_instrumented.outcome || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Stop Android emulator
        if: always()
        timeout-minutes: 1
        run: |
          set +e
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          timeout 10 adb emu kill 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/emulator.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/emulator.pid")" 2>/dev/null || true
            sleep 1
            kill -9 "$(cat "$RUNNER_TEMP/emulator.pid")" 2>/dev/null || true
          fi
          timeout 10 adb kill-server 2>/dev/null || true
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-test-reports
          path: "**/build/reports/androidTests/**"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-emulator-diagnostics
          path: |
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload full CPAS evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cpas-evidence-full
          path: docs/assurance/cpas-evidence-full.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vvf-smartmanager-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7
