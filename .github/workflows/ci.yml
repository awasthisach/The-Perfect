name: VVF Smart Manager CI & Quality Gate
# Candidate workflow: ORT is the active license-compliance gate; FOSSA is retired.

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop", "fix/p0-vault-nio-publish-phase3"]
  workflow_dispatch:

permissions:
  contents: read


env:
  UPLOAD_ARTIFACT_ACTION: b7c566a772e6b6bfb58ed0dc250532a479d7789f

jobs:
  test_and_quality:
    name: Build, Test, Lint & Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Cancel superseded build/test jobs for this branch, without cancelling the
    # independently serialized ORT compliance job.
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ""
          accept-android-sdk-licenses: true
      - name: Install required Android SDK components
        # Keep the PR gate focused on deterministic compile/test/lint/debug-APK work.
        # Emulator + SQLCipher instrumentation are owned by weekly-instrumented.yml.
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties
      # SQLCipher fixture generation is only needed by connectedAndroidTest.
      # This PR job intentionally has no emulator; the weekly hard gate builds the fixture
      # immediately before instrumentation in weekly-instrumented.yml.
      - name: Verify Gradle wrapper
        run: ./gradlew --no-daemon --version
      - name: Run ORT vendored-action regression tests
        run: python3 tools/audit/test_ort_action.py
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace
      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug --stacktrace

      # Emit the resolved release runtime graph as supporting evidence for ORT license review
      # package metadata and source attribution still require review.
      - name: Resolve release runtime dependency graph
        run: ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath --console=plain > release-runtime-dependencies.txt
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Generate CPAS unit evidence
        if: success()
        run: |
          set -euo pipefail
          python3 tools/audit/generate_evidence.py --commit-sha "${{ github.sha }}" --run-id "${{ github.run_id }}" --job-id "${{ github.job }}" --result PASS --environment "github-actions-${{ runner.os }}-unit" --output docs/assurance/cpas-evidence-run.json
      - name: Upload CPAS unit evidence
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cpas-evidence-run
          path: docs/assurance/cpas-evidence-run.json
          if-no-files-found: error
          retention-days: 30

      # SQLCipher instrumentation is owned by weekly-instrumented.yml (hard gate).
# Keep this PR workflow focused on unit tests, lint, dependency review, and debug APK.
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-test-reports
          path: "**/build/reports/androidTests/**"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload release runtime dependency graph
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-runtime-dependency-graph
          path: release-runtime-dependencies.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload full CPAS evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cpas-evidence-full
          path: docs/assurance/cpas-evidence-full.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vvf-smartmanager-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7
