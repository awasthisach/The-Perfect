name: VVF Smart Manager CI & Quality Gate

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # CI is per-ref and only the newest revision needs a build. Nightly ORT has its own non-cancelling concurrency group.
  cancel-in-progress: true

env:
  UPLOAD_ARTIFACT_ACTION: b7c566a772e6b6bfb58ed0dc250532a479d7789f

jobs:
  test_and_quality:
    name: Build, Test, Lint & Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          accept-android-sdk-licenses: true
      - name: Install required Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties
      - name: Generate SQLCipher 4.5.4 compatibility fixture
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev tcl-dev zlib1g-dev
          mkdir -p core/database-compat/src/androidTest/assets
          # Pin SQLCipher source to tag v4.5.4; record sha256 in summary for reproducible audits
          curl -fsSL https://github.com/sqlcipher/sqlcipher/archive/refs/tags/v4.5.4.tar.gz -o /tmp/sqlcipher-4.5.4.tar.gz
          ACTUAL_SHA256="$(sha256sum /tmp/sqlcipher-4.5.4.tar.gz | awk '{print $1}')"
          echo "SQLCipher 4.5.4 tarball sha256=$ACTUAL_SHA256"
          test -s /tmp/sqlcipher-4.5.4.tar.gz
          test "$(stat -c%s /tmp/sqlcipher-4.5.4.tar.gz)" -gt 100000
          tar -xzf /tmp/sqlcipher-4.5.4.tar.gz -C /tmp
          cd /tmp/sqlcipher-4.5.4
          ./configure --enable-tempstore=yes --enable-fts5 CFLAGS="-DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL" LDFLAGS="-lcrypto"
          make -j2
          test -x ./sqlcipher
          FIXTURE="$GITHUB_WORKSPACE/core/database-compat/src/androidTest/assets/legacy-4.5.4.db"
          rm -f "$FIXTURE"
          printf '%s\n' \
            "PRAGMA key = 'vvf-sqlcipher-compatibility-test';" \
            "CREATE TABLE compatibility_test (id INTEGER PRIMARY KEY, value TEXT NOT NULL);" \
            "INSERT INTO compatibility_test (id, value) VALUES (1, 'legacy-4.5.4');" \
            ".quit" | ./sqlcipher "$FIXTURE"
          test -s "$FIXTURE"
          echo "legacy-4.5.4.db bytes=$(stat -c%s "$FIXTURE")"
          echo "sqlcipher_tarball_sha256=$ACTUAL_SHA256" >> "$GITHUB_STEP_SUMMARY"
      - name: Run ORT report validator unit tests
        run: python3 -m unittest discover -s tools/audit -p 'test_*.py' -v
      - name: Verify Gradle wrapper
        run: ./gradlew --no-daemon --version
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace
      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug --stacktrace
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Extract Debug APK SHA-1
        if: success()
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"

          # Resolve apksigner from installed build-tools (not always on PATH).
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Using apksigner: $APKSIGNER"
            "$APKSIGNER" verify --print-certs "$APK_PATH" > /tmp/cert-info.txt 2>&1
          else
            echo "apksigner not found; falling back to keytool."
            keytool -printcert -jarfile "$APK_PATH" > /tmp/cert-info.txt 2>&1
          fi

          # Strip the full label (for example, "SHA-1 digest:") and colon separators.
          # Validate the final value so labels such as "digest:" cannot be emitted as part of the fingerprint.
          SHA1_LINE="$(grep -iE 'SHA-?1' /tmp/cert-info.txt | head -1 || true)"
          SHA1="$(printf '%s\n' "$SHA1_LINE" | sed -E 's/.*[Ss][Hh][Aa]-?1[^:]*:[[:space:]]*//' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"

          if [[ ! "$SHA1" =~ ^[0-9A-F]{40}$ ]]; then
            echo "Failed to parse a 40-character SHA-1 certificate fingerprint."
            echo "Full certificate output:"
            cat /tmp/cert-info.txt
            exit 1
          fi

          echo "DEBUG APK SIGNING-CERTIFICATE SHA-1 (THIS CI RUN)"
          echo "$SHA1"
          echo "Package: com.vvf.smartmanager"

          {
            echo "SHA1=$SHA1"
            echo "Package: com.vvf.smartmanager"
            echo "APK: $APK_PATH"
            echo "Certificate: CI debug APK signing certificate; may differ from local debug and Play App Signing certificates."
            echo "For production OAuth, verify the release keystore and/or Play App Signing certificate fingerprint."
          } | tee /tmp/sha1-info.txt

          echo "debug_apk_sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "### Debug APK signing-certificate SHA-1 (this CI run)" >> "$GITHUB_STEP_SUMMARY"
          echo "$SHA1" >> "$GITHUB_STEP_SUMMARY"
          echo "Package: com.vvf.smartmanager" >> "$GITHUB_STEP_SUMMARY"
          echo "This CI debug certificate may differ from the local debug key and Play App Signing certificate." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify SQLCipher native libs and 16KB alignment
        if: success()
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"

          echo "### SQLCipher dependency graph" >> "$GITHUB_STEP_SUMMARY"
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath 2>/dev/null | \
            tee /tmp/sqlcipher-deps.txt | grep -i sqlcipher || true
          if grep -qiE 'android-database-sqlcipher|net\.sqlcipher' /tmp/sqlcipher-deps.txt; then
            echo "::error::Legacy SQLCipher artifact still on classpath"
            exit 1
          fi
          grep -qi 'net.zetetic:sqlcipher-android' /tmp/sqlcipher-deps.txt || {
            echo "::error::net.zetetic:sqlcipher-android missing from debugRuntimeClasspath"
            exit 1
          }

          echo "### libsqlcipher.so in APK" >> "$GITHUB_STEP_SUMMARY"
          LISTING="$(unzip -l "$APK_PATH" | grep 'libsqlcipher\.so' || true)"
          echo "$LISTING" | tee /tmp/sqlcipher-so.txt
          echo "$LISTING" >> "$GITHUB_STEP_SUMMARY"
          test -n "$LISTING"

          # Exactly one libsqlcipher.so per ABI directory
          while read -r line; do
            [ -z "$line" ] && continue
            path="$(echo "$line" | awk '{print $NF}')"
            case "$path" in
              lib/*/libsqlcipher.so) ;;
              *) echo "::error::Unexpected sqlcipher path: $path"; exit 1 ;;
            esac
          done <<< "$LISTING"
          COUNT="$(echo "$LISTING" | grep -c 'libsqlcipher\.so' || true)"
          echo "libsqlcipher.so count=$COUNT"
          test "$COUNT" -ge 1

          # APK 16KB page-size alignment (Android 15+ requirement path)
          if command -v zipalign >/dev/null 2>&1; then
            zipalign -c -P 16 -v 4 "$APK_PATH" | tee /tmp/zipalign-16.txt
          else
            ZA="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign 2>/dev/null | sort -V | tail -1 || true)"
            test -n "$ZA"
            "$ZA" -c -P 16 -v 4 "$APK_PATH" | tee /tmp/zipalign-16.txt
          fi
          grep -q 'Verification successful' /tmp/zipalign-16.txt

          # ELF LOAD alignment for each packaged ABI (16KB = 0x4000)
          rm -rf /tmp/sqlcipher-extract
          mkdir -p /tmp/sqlcipher-extract
          unzip -o "$APK_PATH" 'lib/*/libsqlcipher.so' -d /tmp/sqlcipher-extract
          READELF="$(command -v llvm-readelf || command -v readelf || true)"
          if [ -n "$READELF" ]; then
            find /tmp/sqlcipher-extract -name 'libsqlcipher.so' | while read -r so; do
              echo "--- $so ---"
              "$READELF" -l "$so" | tee /tmp/elf-"$(basename "$(dirname "$so")").txt"
              ALIGN_OK="$("$READELF" -l "$so" | awk '/LOAD/ {getline; print}' | grep -c '0x4000' || true)"
              # Accept if any LOAD shows Align 2**14 (16384) or 0x4000
              if ! "$READELF" -l "$so" | grep -E 'Align\s+2\*\*14|0x4000' >/dev/null; then
                echo "::warning::Could not confirm 16KB LOAD align for $so (tooling format may differ)"
              fi
            done
          else
            echo "::warning::readelf/llvm-readelf not available; zipalign-only check applied"
          fi
      - name: Upload Debug APK SHA-1 info
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: debug-apk-sha1
          path: /tmp/sha1-info.txt
          if-no-files-found: error
          retention-days: 30
      - name: Generate CPAS unit evidence
        if: success()
        run: |
          set -euo pipefail
          python3 tools/audit/generate_evidence.py --commit-sha "${{ github.sha }}" --run-id "${{ github.run_id }}" --job-id "${{ github.job }}" --result PASS --environment "github-actions-${{ runner.os }}-unit" --output docs/assurance/cpas-evidence-run.json
      - name: Upload CPAS unit evidence
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cpas-evidence-run
          path: docs/assurance/cpas-evidence-run.json
          if-no-files-found: error
          retention-days: 30

      # Emulator boot is deliberately SOFT because GitHub-hosted runners may lack KVM.
      # The step exits successfully on infra failure and exposes booted=false, so no red
      # error annotation is produced. Instrumentation remains HARD when boot succeeds.
      - name: Start Android emulator (soft infra gate)
        id: emulator
        timeout-minutes: 12
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
        run: |
          set -uo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          echo "no" | avdmanager create avd --force --name vvf-api35 --package "system-images;android-35;google_apis;x86_64" --device "pixel_2" || { echo "booted=false" >> "$GITHUB_OUTPUT"; echo "::warning::AVD creation failed; emulator infrastructure unavailable."; exit 0; }
          adb start-server || true
          emulator -avd vvf-api35 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -accel off -no-metrics -wipe-data > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator.pid"
          if ! timeout 180 adb wait-for-device; then
            echo "::warning::adb wait-for-device timed out; treating emulator as an infrastructure skip."
            tail -n 80 "$RUNNER_TEMP/emulator.log" || true
            echo "booted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for _ in $(seq 1 60); do
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            [ "$boot_completed" = "1" ] && break
            sleep 5
          done
          if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" != "1" ]; then
            echo "::warning::Emulator failed to reach sys.boot_completed=1; treating as infrastructure skip."
            tail -n 120 "$RUNNER_TEMP/emulator.log" || true
            echo "booted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb devices
          echo "booted=true" >> "$GITHUB_OUTPUT"
      - name: Annotate SQLCipher instrumented skip
        if: ${{ steps.emulator.outputs.booted != 'true' }}
        run: echo "::warning::GATE-DB-001 emulator did not boot — SQLCipher instrumentation SKIPPED (soft). Weekly instrumented workflow remains the hard DB gate."
      - name: Run SQLCipher compatibility instrumentation test
        id: sqlcipher_instrumented
        if: ${{ steps.emulator.outputs.booted == 'true' }}
        run: ./gradlew --no-daemon :core:database-compat:connectedDebugAndroidTest --stacktrace
      - name: Generate CPAS full DB evidence
        if: ${{ steps.emulator.outputs.booted == 'true' && steps.sqlcipher_instrumented.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 tools/audit/generate_evidence.py --commit-sha "${{ github.sha }}" --run-id "${{ github.run_id }}" --job-id "${{ github.job }}" --result PASS --include-db --environment "github-actions-API35-emulator" --output docs/assurance/cpas-evidence-full.json
      - name: Publish gate summary
        if: always()
        run: |
          echo "## CI gate policy" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Policy |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit tests / lint / assemble | HARD — must pass |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Emulator boot | SOFT — infrastructure failure recorded without failing the job |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SQLCipher instrumented after boot | HARD — failure fails the job |" >> "$GITHUB_STEP_SUMMARY"
          echo "Emulator booted: ${{ steps.emulator.outputs.booted || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Instrumented outcome: ${{ steps.sqlcipher_instrumented.outcome || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Stop Android emulator
        if: always()
        timeout-minutes: 1
        run: |
          set +e
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          timeout 10 adb emu kill 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/emulator.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/emulator.pid")" 2>/dev/null || true
            sleep 1
            kill -9 "$(cat "$RUNNER_TEMP/emulator.pid")" 2>/dev/null || true
          fi
          timeout 10 adb kill-server 2>/dev/null || true
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-test-reports
          path: "**/build/reports/androidTests/**"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-emulator-diagnostics
          path: |
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload full CPAS evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cpas-evidence-full
          path: docs/assurance/cpas-evidence-full.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vvf-smartmanager-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7
