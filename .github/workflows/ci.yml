name: VVF Smart Manager CI & Quality Gate

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_quality:
    name: Build, Test, Lint & Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          accept-android-sdk-licenses: true
      - name: Install required Android SDK components
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties
      - name: Generate SQLCipher 4.5.4 compatibility fixture
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev tcl-dev zlib1g-dev
          mkdir -p core/database-compat/src/androidTest/assets
          curl -fsSL https://github.com/sqlcipher/sqlcipher/archive/refs/tags/v4.5.4.tar.gz -o /tmp/sqlcipher-4.5.4.tar.gz
          tar -xzf /tmp/sqlcipher-4.5.4.tar.gz -C /tmp
          cd /tmp/sqlcipher-4.5.4
          ./configure --enable-tempstore=yes --enable-fts5 CFLAGS="-DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL" LDFLAGS="-lcrypto"
          make -j2
          test -x ./sqlcipher
          ./sqlcipher :memory: "PRAGMA cipher_version;"
          printf '%s\n' "PRAGMA key = 'vvf-sqlcipher-compatibility-test';" "CREATE TABLE compatibility_test (id INTEGER PRIMARY KEY, value TEXT NOT NULL);" "INSERT INTO compatibility_test (id, value) VALUES (1, 'legacy-4.5.4');" ".quit" | ./sqlcipher "$GITHUB_WORKSPACE/core/database-compat/src/androidTest/assets/legacy-4.5.4.db"
          test -s "$GITHUB_WORKSPACE/core/database-compat/src/androidTest/assets/legacy-4.5.4.db"
      - name: Verify Gradle wrapper
        run: ./gradlew --no-daemon --version
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace
      - name: Generate CPAS evidence from unit-test gate
        if: success()
        run: |
          set -euo pipefail
          python3 tools/audit/generate_evidence.py \
            --commit-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --job-id "${{ github.job }}" \
            --result PASS \
            --environment "github-actions-${{ runner.os }}-unit" \
            --output docs/assurance/cpas-evidence-run.json
      - name: Upload CPAS evidence bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpas-evidence-run
          path: docs/assurance/cpas-evidence-run.json
          if-no-files-found: error
          retention-days: 30
      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug --stacktrace
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Start Android emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          echo "no" | avdmanager create avd --force --name vvf-api35 --package "system-images;android-35;google_apis;x86_64" --device "pixel_2"
          adb start-server
          emulator -avd vvf-api35 \
            -no-window \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -noaudio \
            -no-boot-anim \
            -camera-back none \
            -accel off \
            -no-metrics \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator.pid"
          adb wait-for-device
          for _ in $(seq 1 240); do
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$boot_completed" = "1" ]; then
              break
            fi
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb devices
      - name: Run SQLCipher compatibility instrumentation test
        run: ./gradlew --no-daemon :core:database-compat:connectedDebugAndroidTest --stacktrace
      - name: Generate CPAS evidence including DB instrumented gate
        if: success()
        run: |
          set -euo pipefail
          python3 tools/audit/generate_evidence.py \
            --commit-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --job-id "${{ github.job }}" \
            --result PASS \
            --include-db \
            --environment "github-actions-API35-emulator" \
            --output docs/assurance/cpas-evidence-full.json
      - name: Upload full CPAS evidence bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpas-evidence-full
          path: docs/assurance/cpas-evidence-full.json
          if-no-files-found: error
          retention-days: 30
      - name: Collect Android emulator diagnostics
        if: failure()
        timeout-minutes: 2
        run: |
          set +e
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          if ! timeout 10 adb devices 2>/dev/null | grep -qE 'device$'; then
            echo "No adb device present (emulator never started or already gone). Skipping diagnostics."
            echo "unit-test or earlier step failed before emulator boot." > "$RUNNER_TEMP/emulator-logcat.txt" || true
            exit 0
          fi
          timeout 15 adb devices -l || true
          timeout 20 adb shell getprop || true
          timeout 30 adb logcat -d -t 2000 > "$RUNNER_TEMP/emulator-logcat.txt" || true
          cat "$RUNNER_TEMP/emulator.log" 2>/dev/null || true
      - name: Stop Android emulator
        if: always()
        timeout-minutes: 1
        run: |
          set +e
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          timeout 10 adb emu kill 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/emulator.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/emulator.pid")" 2>/dev/null || true
            sleep 1
            kill -9 "$(cat "$RUNNER_TEMP/emulator.pid")" 2>/dev/null || true
          fi
          timeout 10 adb kill-server 2>/dev/null || true
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-reports
          path: "**/build/reports/androidTests/**"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-emulator-diagnostics
          path: |
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/emulator-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vvf-smartmanager-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7

  license_compliance:
    name: Open Source License Compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Secret name in this repo is GH_FOSSA.
    env:
      FOSSA_ENABLED: ${{ secrets.GH_FOSSA != '' }}
      FOSSA_API_KEY: ${{ secrets.GH_FOSSA }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Record FOSSA gate status when credentials missing
        if: ${{ env.FOSSA_ENABLED != 'true' }}
        run: |
          set -euo pipefail
          cat > foss-status.json <<'EOF'
          {
            "gate_id": "GATE-LICENSE-001",
            "status": "BLOCKED",
            "reason": "GH_FOSSA secret is not configured",
            "policy": "CI records BLOCKED; release promotion requires FOSSA PASS"
          }
          EOF
          echo "::warning::GH_FOSSA missing — GATE-LICENSE-001 BLOCKED for release."

      - name: Diagnose FOSSA credentials (non-secret)
        if: ${{ env.FOSSA_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          # Never print the key — only length and charset sanity.
          LEN="${#FOSSA_API_KEY}"
          echo "GH_FOSSA length=$LEN"
          if [ "$LEN" -lt 16 ]; then
            echo "::error::GH_FOSSA looks too short (len=$LEN). Create a Push-Only API token in FOSSA dashboard."
            exit 1
          fi
          # Reject common copy/paste accidents (whitespace/newlines)
          if printf '%s' "$FOSSA_API_KEY" | grep -q '[[:space:]]'; then
            echo "::error::GH_FOSSA contains whitespace — re-paste token without spaces/newlines."
            exit 1
          fi

      - name: Install FOSSA CLI
        if: ${{ env.FOSSA_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash
          fossa --version

      - name: FOSSA analyze (upload inventory)
        if: ${{ env.FOSSA_ENABLED == 'true' }}
        env:
          FOSSA_API_KEY: ${{ secrets.GH_FOSSA }}
        run: |
          set -euo pipefail
          # Android/Gradle monorepo: analyze from repo root.
          fossa analyze --project "The-Perfect" --revision "${{ github.sha }}"

      - name: FOSSA test (license policy gate)
        if: ${{ env.FOSSA_ENABLED == 'true' }}
        env:
          FOSSA_API_KEY: ${{ secrets.GH_FOSSA }}
        run: |
          set -euo pipefail
          # Fails if FOSSA project policy finds issues, or if auth/project is wrong.
          fossa test --timeout 600

      - name: Record FOSSA gate status on successful scan
        if: ${{ env.FOSSA_ENABLED == 'true' && success() }}
        run: |
          cat > foss-status.json <<'EOF'
          {
            "gate_id": "GATE-LICENSE-001",
            "status": "PASS",
            "reason": "fossa analyze + fossa test succeeded via GH_FOSSA",
            "policy": "CI records PASS; release promotion requires FOSSA PASS"
          }
          EOF

      - name: Record FOSSA gate status on scan failure
        if: ${{ env.FOSSA_ENABLED == 'true' && failure() }}
        run: |
          cat > foss-status.json <<'EOF'
          {
            "gate_id": "GATE-LICENSE-001",
            "status": "FAIL",
            "reason": "fossa analyze or fossa test failed — check API token type (Push-Only), project link, or license policy",
            "policy": "Release promotion requires FOSSA PASS"
          }
          EOF

      - name: Upload FOSSA gate status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foss-status
          path: foss-status.json
          if-no-files-found: ignore
          retention-days: 30
