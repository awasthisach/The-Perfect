name: VVF Smart Manager CI & Quality Gate

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: read

jobs:
  test_and_coverage:
    name: Unit Tests, JaCoCo Coverage & Codecov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Verify committed Gradle wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew --version

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Run Unit Tests across all modules
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Upload Coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            **/build/reports/jacoco/**/*.xml
          fail_ci_if_error: true
          verbose: true

      - name: Archive Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

      - name: Archive Room schema exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: |
            core/database/schemas/**/*.json
            core/database/build/generated/**/schemas/**/*.json
            **/schemas/**/*.json
          if-no-files-found: ignore

  license_compliance:
    name: FOSSA & Open Source License Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Verify committed Gradle wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew --version

      - name: Run FOSSA License Scan
        if: ${{ env.FOSSA_API_KEY != '' }}
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        uses: fossas/fossa-action@v1
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          run-tests: true

  build_and_release:
    name: Build Release (unsigned CI verification)
    needs: [test_and_coverage]
    runs-on: ubuntu-latest
    env:
      ALLOW_UNSIGNED_RELEASE: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Verify committed Gradle wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew --version

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Build unsigned release artifact
        run: ./gradlew assembleRelease --stacktrace

      - name: Archive Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vvf-smartmanager-release-apk-unsigned
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: error
