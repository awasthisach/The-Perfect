name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Run OpenRouter AI Review
        uses: jonit-dev/openrouter-github-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          open_router_key: ${{ secrets.OPENROUTER_API_KEY }} # आपकी GitHub Secret का नाम
          model_id: 'deepseek/deepseek-v4-flash:free' # मुफ़्त मॉडल
          max_tokens: '4096' # बड़े कोड रिव्यू के लिए
