name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    # Use the debug variant for static analysis. The release variant requires
    # owner-managed signing credentials and must not be built by CodeQL CI.
    - name: Build Android debug variant for CodeQL
      run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
