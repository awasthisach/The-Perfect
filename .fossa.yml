# FOSSA 2.0 Configuration for VVF Smart Manager
version: 2

cli:
  server: https://app.fossa.com

analyze:
  modules:
    - name: "VVF Smart Manager Core"
      type: "gradle"
      target: ":app"
      path: "."
    - name: "Core Common"
      type: "gradle"
      target: ":core:common"
      path: "core/common"
    - name: "Core Database"
      type: "gradle"
      target: ":core:database"
      path: "core/database"
    - name: "Core Security"
      type: "gradle"
      target: ":core:security"
      path: "core/security"
    - name: "Core Domain"
      type: "gradle"
      target: ":core:domain"
      path: "core/domain"
    - name: "Core Data"
      type: "gradle"
      target: ":core:data"
      path: "core/data"
    - name: "Plugin OCR"
      type: "gradle"
      target: ":plugins:plugin-ocr"
      path: "plugins/plugin-ocr"

policy:
  # Allowed Open Source Licenses for VVF Smart Manager
  allow:
    - "Apache-2.0"
    - "MIT"
    - "BSD-2-Clause"
    - "BSD-3-Clause"
    - "ISC"
    - "Unlicense"
    - "CC0-1.0"
  
  # Denied Viral / Copyleft Licenses that conflict with Play Store distribution
  deny:
    - "GPL-3.0-only"
    - "GPL-3.0-or-later"
    - "AGPL-3.0-only"
    - "AGPL-3.0-or-later"
    - "SSPL-1.0"
