version: 3
server: https://app.fossa.com
project:
  id: github.com/awasthisach/The-Perfect
  name: The-Perfect

# The release compliance gate should assess dependencies resolved into Android
# release runtime classpaths, not compiler/plugin/test tooling that is not shipped
# in the APK. This is an analysis-scope filter, not a license allowlist.
# FOSSA documents this Gradle configuration filter as experimental; the CI scan
# must verify that the runtime graph is still discovered and policy-tested.
experimental:
  gradle:
    configurations-only:
      - releaseRuntimeClasspath
