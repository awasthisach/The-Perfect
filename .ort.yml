---
# Correct stale SCM provenance from published Maven POMs.
# The exact source artifact URLs and SHA-1 hashes are emitted by ORT's analyzer
# for these package IDs. Force scanning those published source artifacts rather
# than attempting obsolete or malformed SVN endpoints. No license conclusions,
# license overrides, or dependency exclusions are introduced.
curations:
  packages:
    - id: "Maven:com.almworks.sqlite4java:sqlite4java:1.0.392"
      curations:
        comment: "The published POM points to retired Google Code SVN; ORT analyzer resolves a Maven Central sources JAR with SHA-1."
        source_code_origins: [ARTIFACT]

    - id: "Maven:com.google.j2objc:j2objc-annotations:1.3"
      curations:
        comment: "The published POM points to obsolete Sonatype Spice SVN; scan the analyzer-resolved Maven Central sources JAR."
        source_code_origins: [ARTIFACT]

    - id: "Maven:com.google.j2objc:j2objc-annotations:2.8"
      curations:
        comment: "The published POM points to obsolete Sonatype Spice SVN; scan the analyzer-resolved Maven Central sources JAR."
        source_code_origins: [ARTIFACT]

    - id: "Maven:com.googlecode.java-diff-utils:diffutils:1.3.0"
      curations:
        comment: "The published POM points to retired Google Code SVN; ORT analyzer resolves a Maven Central sources JAR with SHA-1."
        source_code_origins: [ARTIFACT]

    - id: "Maven:io.opencensus:opencensus-api:0.31.0"
      curations:
        comment: "The published POM VCS metadata is incorrectly classified as SVN although the project is hosted on GitHub; scan the analyzer-resolved Maven Central sources JAR."
        source_code_origins: [ARTIFACT]

    - id: "Maven:io.opencensus:opencensus-proto:0.2.0"
      curations:
        comment: "The published POM VCS metadata is incorrectly classified as SVN although the project is hosted on GitHub; scan the analyzer-resolved Maven Central sources JAR."
        source_code_origins: [ARTIFACT]
