# Current release blockers remain open until evidence-backed closure.
open_findings:
  - id: PROD-008
    severity: high
    title: FOSSA policy findings and outdated dependencies remain unresolved
    status: triaged
    notes: >
      FOSSA test on CI run #38703527318 evaluated revision
      3c7ab9d98198a8b85216f63fcecfa0b7a74eb9d4 and returned 66 unresolved issues:
      59 policy_flag, 5 policy_conflict, and 2 outdated_dependency. The scan
      completed and emitted a structured report, so the prior claim that the
      configured GH_FOSSA token is push-only and issue details are unavailable
      is stale and removed. Findings must be classified by dependency path and
      license evidence, then fixed or formally approved under policy; do not
      blanket-whitelist or suppress them. CI evidence:
      https://github.com/awasthisach/The-Perfect/actions/runs/38703527318
      Related issue #136.
    residual_risk: high
    related_issue: 136
    last_updated: "2026-10-15"

  - id: PROD-009
    severity: high
    title: Native Worker v4 authentication and App Check acceptance is incomplete
    status: repair_implemented
    notes: >
      Protected deployment workflow #38676382484 succeeded on candidate head
      855d788cafd695c3fa8410d10fedecdb66ce6e16. CI verified the v4 health
      contract (gemini-embedding-2, 768 dimensions) and rejection of /embed
      without Firebase credentials. This resolves the stale-v3 deployment
      portion, but does not prove invalid App Check rejection or a successful
      real Android request with valid Firebase Auth + App Check. Keep open until
      those authenticated acceptance checks are recorded. Related issue #140.
    residual_risk: high
    related_issue: 140
    last_updated: "2026-10-15"

  - id: PROD-010
    severity: high
    title: Real-account OAuth, privacy, signing, and device acceptance are unverified
    status: triaged
    notes: >
      Restricted drive.readonly verification, Firebase/Google OAuth and signing
      fingerprints, paid Gemini billing/data handling, published privacy policy,
      release artifact signing/provenance, and physical-device acceptance are
      not yet evidenced. Public release remains blocked until the required
      checks are completed. Related issue #141.
    residual_risk: high
    related_issue: 141
    last_updated: "2026-10-15"

