# Current release blockers remain open until evidence-backed closure.
open_findings:
  - id: PROD-008
    severity: high
    title: FOSSA policy findings and license attribution require resolution
    status: triaged
    notes: >
      FOSSA CI run #38950701170 scanned candidate SHA
      640c1e3a1ef1d4609766633d74c52e4ed15f4cb4. Analysis succeeded, but
      fossa test exited 1 with 34 unresolved findings: 30 policy_flag and
      4 policy_conflict; the structured result showed zero quality and zero
      vulnerability issues for that FOSSA report. The releaseRuntimeClasspath
      graph artifact includes all seven affected coordinates: ML Kit
      common 18.11.0, vision-common 17.3.0, vision-interfaces 16.3.0;
      Play core-common 2.0.4; Firebase firebase-auth 24.2.0 and
      firebase-auth-interop 20.0.0; and jakarta.inject-api 2.0.1.
      Therefore these findings cannot be dismissed as build-only based on
      current evidence. FOSSA target inventory listed 37 Gradle module targets
      and warned list-targets does not apply filtering, so the experimental
      releaseRuntimeClasspath filter has not been proven to constrain analyzed
      targets. Several detected licenses conflict with upstream package metadata,
      suggesting package-license attribution needs evidence-backed correction,
      but no license was blanket-approved. The issue-export artifact and captured
      job log were inconsistent; CI workflow now records HTTP status separately.
      Re-run current-head FOSSA and reconcile each package/version/license against
      upstream metadata and shipped artifact before closing. Evidence:
      https://github.com/awasthisach/The-Perfect/actions/runs/38950701170
      Related issue #136.
    residual_risk: high
    related_issue: 136
    last_updated: "2026-10-17"

  - id: PROD-009
    severity: high
    title: Native Worker v4 authentication and App Check acceptance is incomplete
    status: repair_implemented
    notes: >
      Protected deployment workflow #38676382484 previously verified the v4 health
      contract (gemini-embedding-2, 768 dimensions) and rejection of /embed
      without Firebase credentials. Current candidate CI run #38950701190
      passed the Worker build gate, but that is not deployment or native
      acceptance evidence. Invalid App Check rejection and a successful real
      Android request with valid Firebase Auth + App Check remain unverified.
      Keep open until those authenticated acceptance checks are recorded.
      Related issue #140.
    residual_risk: high
    related_issue: 140
    last_updated: "2026-10-15"

  - id: PROD-010
    severity: high
    title: Real-account OAuth, privacy, signing, and device acceptance are unverified
    status: triaged
    notes: >
      Read-only Google Cloud inspection on 2026-10-17 confirmed the Firebase
      Android app ID 1:1058219630435:android:759d656a98d3b50aee3d56 and an Android
      OAuth client for package com.vvf.smartmanager. The previous web client ID
      in .env.example was not present; it was replaced with the existing
      Firebase-generated Web client ID, but the protected release workflow has
      not yet confirmed that ID against google-services.json. Firebase Project
      Settings shows no SHA certificate fingerprints, and the only visible
      Android OAuth SHA-1 may be stale relative to the actual release key.
      Restricted drive.readonly verification, signing fingerprints, paid Gemini
      billing/data handling, published privacy policy, signed artifact provenance,
      and physical-device acceptance remain unverified. Public release remains
      blocked until the required checks are completed. Related issue #141.
    residual_risk: high
    related_issue: 141
    last_updated: "2026-10-15"

