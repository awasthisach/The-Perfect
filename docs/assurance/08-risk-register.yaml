open_findings:
  - id: PROD-008
    severity: high
    title: FOSSA policy findings and outdated dependencies remain unresolved
    status: triaged
    notes: >
      FOSSA on CI run #38950701170 scanned the exact candidate revision
      640c1e3a1ef1d4609766633d74c52e4ed15f4cb4. The analysis succeeded, but
      the policy test exited 1 and the mandatory license gate failed. The
      workflow's attempted issue-export endpoint did not return a usable report;
      the diagnostics artifact records the export as unavailable. Do not infer
      a zero-finding result or claim the release-runtime scope filter resolved
      findings until the actual target inventory and structured test report are
      reviewed. The release runtime dependency graph artifact was produced by
      the same run. Findings remain unresolved and must be classified by
      dependency path and license evidence; do not blanket-whitelist or suppress.
      CI evidence:
      https://github.com/awasthisach/The-Perfect/actions/runs/38950701170
      Related issue #136.
    residual_risk: high
    related_issue: 136
    last_updated: "2026-10-15"

  - id: PROD-009
    severity: high
    title: Native Worker v4 authentication and App Check acceptance is incomplete
    status: repair_implemented
    notes: >
      Protected deployment workflow #38676382484 previously verified the v4 health
      contract (gemini-embedding-2, 768 dimensions) and rejection of /embed
      without Firebase credentials. Current candidate CI run #38950701190
      passed the Worker build gate, but that is not deployment or native
      acceptance evidence. Invalid App Check rejection and a successful real
      Android request with valid Firebase Auth + App Check remain unverified.
      Keep open until those authenticated acceptance checks are recorded.
      Related issue #140.
    residual_risk: high
    related_issue: 140
    last_updated: "2026-10-15"

  - id: PROD-010
    severity: high
    title: Real-account OAuth, privacy, signing, and device acceptance are unverified
    status: triaged
    notes: >
      Restricted drive.readonly verification, Firebase/Google OAuth and signing
      fingerprints, paid Gemini billing/data handling, published privacy policy,
      release artifact signing/provenance, and physical-device acceptance are
      not yet evidenced. Public release remains blocked until the required
      checks are completed. Related issue #141.
    residual_risk: high
    related_issue: 141
    last_updated: "2026-10-15"

